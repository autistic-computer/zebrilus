[package]
name = "zz-config"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Shared configuration parsing and persistence for zz clients"
publish = false

[features]
update = []

[dependencies]
zz-client.workspace = true
zz-daemon-client.workspace = true
zz-protocol.workspace = true
zz-mux.workspace = true
zz-terminal.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
semver = "1"
sha2 = "0.11"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
ureq = { version = "3", default-features = false, features = ["gzip", "rustls-no-provider", "rustls-webpki-roots"] }
flate2 = "1"
tar = "0.4"

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
