[package]
name = "zz-simulator"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Screen and input access to a booted iOS simulator"
publish = false

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
core-foundation.workspace = true
core-video.workspace = true
libc.workspace = true
objc2.workspace = true
objc2-core-foundation = { workspace = true, features = ["CFCGTypes"] }
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSEnumerator", "NSError", "NSString", "NSUUID"] }
thiserror.workspace = true

[lints]
workspace = true
