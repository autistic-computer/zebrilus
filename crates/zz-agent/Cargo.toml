[package]
name = "zz-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The zz agent runtime: Claude, Codex and ACP drivers, host, fanout, journal and logins"
publish = false

[features]
test-support = []

[dependencies]
agent-client-protocol.workspace = true
async-channel.workspace = true
base64.workspace = true
chrono = { workspace = true, features = ["alloc", "std", "clock"] }
crossbeam-channel.workspace = true
futures-lite.workspace = true
getrandom.workspace = true
log.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
smol.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
zz-daemon-client.workspace = true
zz-machine.workspace = true
zz-protocol.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-registry.workspace = true

[lints]
workspace = true
