[package]
name = "zz-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Chromium off-screen rendering for wgpu apps: CEF frames as GPU textures, input, profiles, cookies"
publish = false

[features]
default = ["cef-runtime"]
host = [
    "dep:ala",
    "dep:async-channel",
    "dep:base64",
    "dep:block2",
    "dep:objc2",
    "dep:objc2-core-foundation",
    "dep:objc2-io-surface",
    "dep:objc2-metal",
    "dep:pollster",
    "dep:wgpu",
]
cef-runtime = ["host", "dep:cef", "dep:ash"]

[dependencies]
async-channel = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
cef = { workspace = true, optional = true }
log.workspace = true
parking_lot.workspace = true
pollster = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
wgpu = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
getrandom.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ash = { version = "0.38", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
ala = { workspace = true, optional = true, features = ["default"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { workspace = true, optional = true }
objc2 = { workspace = true, optional = true }
objc2-core-foundation = { workspace = true, optional = true, features = ["CFDictionary", "CFNumber", "CFString"] }
objc2-io-surface = { workspace = true, optional = true }
objc2-metal = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
