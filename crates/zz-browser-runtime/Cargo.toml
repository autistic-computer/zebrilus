[package]
name = "zz-browser-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["chromium"]
chromium = ["ala-cef/cef-runtime"]
ladybird = ["dep:rustix", "dep:sha2"]

[dependencies]
ala-cef = { workspace = true, features = ["host", "chrome-import"] }
async-channel.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
log.workspace = true
zz-daemon-client.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
sha2 = { version = "0.11", optional = true }
rustix = { workspace = true, features = ["net", "fs"], optional = true }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
