[package]
name = "zz-tailnet"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "zz's own Tailscale node: sign in, accept into the daemon, dial for local clients"
publish = false

[target.'cfg(any(target_os = "linux", all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
log.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tailscale = "=0.7.1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
zz-daemon-client.workspace = true

[lints]
workspace = true
