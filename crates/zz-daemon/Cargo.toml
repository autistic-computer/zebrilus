[package]
name = "zz-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The zz daemon: session state, PTY workers, client connections"
publish = false

[features]
default = ["agent", "tailnet-own"]
tailnet-own = ["dep:zz-tailnet"]
agent = ["dep:zz-agent", "dep:futures-lite", "dep:zz-machine"]

[dependencies]
chrono = { workspace = true, features = ["alloc", "std"] }
futures-lite = { workspace = true, optional = true }
getrandom.workspace = true
glob = "0.3"
ignore.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
libc.workspace = true
log.workspace = true
parking_lot.workspace = true
regex.workspace = true
semver.workspace = true
tempfile.workspace = true
thiserror.workspace = true
zz-config.workspace = true
zz-daemon-client.workspace = true
zz-agent = { workspace = true, optional = true }
zz-mux.workspace = true
zz-protocol.workspace = true
zz-machine = { workspace = true, optional = true }
zz-terminal = { workspace = true, features = ["session"] }

[target.'cfg(unix)'.dependencies]
mio = { version = "1.2.3", features = ["os-poll", "os-ext"] }
signal-hook = { version = "0.4.4", default-features = false }
rustix = { workspace = true, features = ["fs", "net"] }

[target.'cfg(any(target_os = "linux", all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
zz-tailnet = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-registry.workspace = true
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
agent-client-protocol.workspace = true
async-channel.workspace = true
zz-agent = { workspace = true, features = ["test-support"] }
chrono = { workspace = true, features = ["clock"] }

[lints]
workspace = true
