[package]
name = "zz-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "zz's application UI on penna: panes, terminal, agent, palette, settings, navigation"
publish = false

[features]
default = []
agent = ["dep:merman"]
editor = ["penna/editor"]
tree-sitter = ["penna/tree-sitter"]

[dependencies]
image.workspace = true
log.workspace = true
markdown = { version = "1.0", features = ["serde"] }
merman = { workspace = true, optional = true }
parking_lot.workspace = true
rust-embed = { version = "8.12", features = ["include-exclude"] }
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
web-time.workspace = true
ala = { workspace = true, features = ["default"] }
zz-client.workspace = true
penna.workspace = true
zz-protocol.workspace = true
zz-terminal.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
rust-embed = { version = "8.12", features = ["include-exclude", "debug-embed"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
url.workspace = true

[dev-dependencies]
ala = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
