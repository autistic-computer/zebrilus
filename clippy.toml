# Vendor names that read as prose, not as code: `doc_markdown` flags their
# internal capitals and backticking a company name is worse than the lint.
# `..` keeps clippy's own default list.
doc-valid-idents = ["OpenAI", "AppKit", "KWin", ".."]

disallowed-methods = [
    { path = "zz_gpui::rgb", reason = "chrome colors must come from cx.theme(); see knowledge/configuration/ui-conventions doc" },
    { path = "zz_gpui::rgba", reason = "chrome colors must come from cx.theme(); see knowledge/configuration/ui-conventions doc" },
    { path = "zz_gpui::hsla", reason = "chrome colors must come from cx.theme(); see knowledge/configuration/ui-conventions doc" },
    { path = "zz_gpui_kit::Colorize::raised", reason = "name a tone and an emphasis (theme.paint) or a surface (theme.surface) instead; see knowledge/designs/design-system doc" },
    { path = "zz_gpui_kit::Colorize::washed", reason = "name a tone and an emphasis (theme.paint) or a surface (theme.surface) instead; see knowledge/designs/design-system doc" },
    { path = "zz_gpui_kit::Colorize::wash", reason = "name a tone and an emphasis (theme.paint) or a surface (theme.surface) instead; see knowledge/designs/design-system doc" },
    { path = "zz_gpui_kit::Colorize::fill", reason = "name a tone and an emphasis (theme.paint) or a surface (theme.surface) instead; see knowledge/designs/design-system doc" },
    { path = "zz_gpui_kit::Colorize::outline", reason = "name a tone and an emphasis (theme.paint) or a surface (theme.surface) instead; see knowledge/designs/design-system doc" },
    { path = "zz_gpui_kit::Colorize::subtle", reason = "name a tone and an emphasis (theme.paint) or a surface (theme.surface) instead; see knowledge/designs/design-system doc" },
    { path = "zz_gpui_kit::Colorize::glow", reason = "name a tone and an emphasis (theme.paint) or a surface (theme.surface) instead; see knowledge/designs/design-system doc" },
    { path = "zz_gpui_kit::Colorize::hover", reason = "name a tone and an emphasis (theme.paint) or a surface (theme.surface) instead; see knowledge/designs/design-system doc" },
    { path = "zz_gpui_kit::Colorize::active", reason = "name a tone and an emphasis (theme.paint) or a surface (theme.surface) instead; see knowledge/designs/design-system doc" },
    { path = "zz_gpui_kit::Colorize::on", reason = "name a tone and an emphasis (theme.paint) or a surface (theme.surface) instead; see knowledge/designs/design-system doc" },
    { path = "zz_gpui_kit::Colorize::floating", reason = "name a tone and an emphasis (theme.paint) or a surface (theme.surface) instead; see knowledge/designs/design-system doc" },
    { path = "zz_gpui::Hsla::opacity", reason = "name a tone and an emphasis (theme.paint) or a surface (theme.surface) instead; see knowledge/designs/design-system doc" },
    { path = "std::process::Command::spawn", reason = "children inherit the signal mask of the spawning thread; spawn through zz_daemon_client::unmasked::SpawnUnmasked" },
    { path = "std::process::Command::output", reason = "children inherit the signal mask of the spawning thread; spawn through zz_daemon_client::unmasked::SpawnUnmasked" },
    { path = "std::process::Command::status", reason = "children inherit the signal mask of the spawning thread; spawn through zz_daemon_client::unmasked::SpawnUnmasked" },
]
