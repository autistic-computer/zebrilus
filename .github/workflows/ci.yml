name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-24.04","macos-15","windows-2025"]' || '["ubuntu-24.04","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    env:
      CEF_PATH: ${{ github.workspace }}/.cef-cache
      CARGO_PROFILE_RELEASE_LTO: ${{ github.event_name == 'schedule' && 'fat' || 'false' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ github.event_name == 'schedule' && '1' || '16' }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check tmux compatibility summary freshness
        if: runner.os == 'Linux'
        run: |
          git ls-files --error-unmatch compat/results/summary.md
          compat/run.sh --check-summary

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf automake bison cmake curl desktop-file-utils dpkg-dev libevent-dev libfontconfig-dev libncurses-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev mesa-vulkan-drivers ninja-build pkg-config

      - name: Install macOS packaging smoke tools
        if: runner.os == 'macOS'
        run: brew install tmux

      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
          use-cache: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Cache matching CEF distribution
        uses: actions/cache@v6.1.0
        with:
          path: ${{ github.workspace }}/.cef-cache
          key: cef-154.0.23-${{ runner.os }}-${{ runner.arch }}

      - name: Cache pinned tmux build
        if: runner.os == 'Linux'
        uses: actions/cache@v6.1.0
        with:
          path: ${{ github.workspace }}/compat/.cache
          key: tmux-${{ hashFiles('compat/tmux-oracle.json', 'compat/fetch-tmux.sh', 'compat/fetch-corpus.sh') }}-${{ runner.os }}-${{ runner.arch }}

      - name: Check tmux compatibility tracker
        if: runner.os == 'Linux'
        run: compat/check.sh

      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path libs/penna/storybook/Cargo.toml -- --check

      - name: Lint
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Lint daemon without agent support
        if: runner.os == 'Linux'
        run: cargo clippy -p zz-daemon -p zz-daemon-client --no-default-features --all-targets -- -D warnings

      - name: Lint libs
        if: runner.os == 'Linux'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo clippy --manifest-path libs/ala/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          cargo metadata --locked --format-version 1 --manifest-path libs/penna/Cargo.toml >/dev/null
          cargo metadata --locked --format-version 1 --manifest-path libs/penna/storybook/Cargo.toml >/dev/null
          cargo clippy --manifest-path libs/penna/Cargo.toml --all-targets --all-features --config "patch.\"https://github.com/autistic-computer/ala\".ala.path=\"$PWD/libs/ala/crates/ala\"" -- -D warnings
          cargo clippy --manifest-path libs/penna/Cargo.toml --lib --no-default-features --config "patch.\"https://github.com/autistic-computer/ala\".ala.path=\"$PWD/libs/ala/crates/ala\"" -- -D warnings
          cargo clippy --manifest-path libs/penna/storybook/Cargo.toml --all-targets --all-features --config "patch.\"https://github.com/autistic-computer/ala\".ala.path=\"$PWD/libs/ala/crates/ala\"" --config "patch.\"https://github.com/autistic-computer/ala\".ala-platform.path=\"$PWD/libs/ala/crates/ala-platform\"" -- -D warnings
          rustup target add wasm32-unknown-unknown
          cargo clippy --manifest-path libs/penna/storybook/Cargo.toml --target wasm32-unknown-unknown --lib --features page --config "patch.\"https://github.com/autistic-computer/ala\".ala.path=\"$PWD/libs/ala/crates/ala\"" --config "patch.\"https://github.com/autistic-computer/ala\".ala-platform.path=\"$PWD/libs/ala/crates/ala-platform\"" -- -D warnings
          cargo clippy --manifest-path libs/ala-cef/Cargo.toml --all-targets --all-features --config "patch.\"https://github.com/autistic-computer/ala\".ala.path=\"$PWD/libs/ala/crates/ala\"" -- -D warnings

      - name: Check browser client
        if: runner.os == 'Linux'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo fmt --manifest-path clients/web/Cargo.toml -- --check
          rustup toolchain install nightly --profile minimal --target wasm32-unknown-unknown
          rustup run nightly cargo check --manifest-path clients/web/Cargo.toml --target wasm32-unknown-unknown --all-targets --locked

      - name: Test workspace
        continue-on-error: ${{ runner.os == 'Windows' }}
        timeout-minutes: ${{ runner.os == 'Windows' && 90 || 360 }}
        run: cargo ci-test ${{ runner.os == 'Windows' && '--no-fail-fast' || '' }}

      - name: Test libs
        continue-on-error: ${{ runner.os == 'Windows' }}
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo test --manifest-path libs/ala/Cargo.toml --workspace --all-features --exclude ala-platform
          cargo test --manifest-path libs/penna/Cargo.toml --all-features --config "patch.\"https://github.com/autistic-computer/ala\".ala.path=\"$PWD/libs/ala/crates/ala\""
          cargo test --manifest-path libs/penna/Cargo.toml --test highlighter_api --config "patch.\"https://github.com/autistic-computer/ala\".ala.path=\"$PWD/libs/ala/crates/ala\""
          cargo test --manifest-path libs/penna/storybook/Cargo.toml --all-features --config "patch.\"https://github.com/autistic-computer/ala\".ala.path=\"$PWD/libs/ala/crates/ala\"" --config "patch.\"https://github.com/autistic-computer/ala\".ala-platform.path=\"$PWD/libs/ala/crates/ala-platform\""
          cargo test --manifest-path libs/ala-cef/Cargo.toml --all-features --config "patch.\"https://github.com/autistic-computer/ala\".ala.path=\"$PWD/libs/ala/crates/ala\""

      - name: Test the iOS input logic
        if: runner.os != 'Linux'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo test --manifest-path libs/ala/Cargo.toml -p ala-platform --all-features --test ios

      - name: Test ala-platform on lavapipe (software Vulkan)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          export VK_ICD_FILENAMES=$(echo /usr/share/vulkan/icd.d/lvp_icd*.json)
          cargo test --manifest-path libs/ala/Cargo.toml -p ala-platform --all-features

      - name: Test zz-mux release profile
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: cargo test --release -p zz-mux

      - name: Run the attached-client fixture
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          cargo build -p zz-cli
          compat/attached-client.sh target/debug/zz_cli "$(compat/fetch-tmux.sh)"

      - name: Build and validate CEF bundle
        run: cargo xtask bundle-cef --release --output target/cef-bundle

      - name: Headless binary stays GUI-free
        shell: bash
        run: |
          tree=$(cargo tree -p zz-cli -e normal --prefix none)
          if grep -Eq '^(ala|ala-platform|ala-cef|wgpu|cef|penna|zz-ui|zz-chrome-import) ' <<<"$tree"; then
            echo "zz-cli links GUI crates"
            exit 1
          fi
          if grep -Eq '^(ureq|rustls|ring) ' <<<"$tree"; then
            echo "zz-cli links the update checker's TLS stack"
            exit 1
          fi

      - name: Smoke packaged macOS CLI
        if: runner.os == 'macOS'
        run: compat/packaged-cli.sh target/cef-bundle/zz.app

      - name: Download verified AppImage tools
        if: runner.os == 'Linux'
        run: scripts/fetch-appimage-tools.sh

      - name: Package Linux release outputs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          binary_artifact="target/zz-linux-${RUNNER_ARCH}-binary.tar.gz"
          package_artifact="target/zz-linux-${RUNNER_ARCH}.AppImage"

          test -x target/release/zz
          tar -C target/release -czf "$binary_artifact" zz
          scripts/package-appimage.sh target/cef-bundle "$package_artifact"
          scripts/package-deb.sh target/cef-bundle target/zz-linux.deb

          echo "ZZ_BINARY_ARTIFACT_PATH=$binary_artifact" >> "$GITHUB_ENV"
          echo "ZZ_PACKAGE_ARTIFACT_PATH=$package_artifact" >> "$GITHUB_ENV"

      - name: Package macOS release outputs
        if: runner.os == 'macOS'
        shell: bash
        run: |
          binary_artifact="target/zz-macos-${RUNNER_ARCH}-binaries.tar.gz"
          package_artifact="target/zz-macos-${RUNNER_ARCH}.dmg"

          test -x target/release/zz
          test -x target/release/zz_helper
          test -x target/release/zz_cli
          tar -C target/release -czf "$binary_artifact" zz zz_helper zz_cli
          scripts/package-dmg.sh target/cef-bundle/zz.app "$package_artifact"

          echo "ZZ_BINARY_ARTIFACT_PATH=$binary_artifact" >> "$GITHUB_ENV"
          echo "ZZ_PACKAGE_ARTIFACT_PATH=$package_artifact" >> "$GITHUB_ENV"

      - name: Package Windows release outputs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifact = "target/zz-windows-$env:RUNNER_ARCH.zip"
          ./scripts/package-windows.ps1 target/cef-bundle $artifact
          "ZZ_PACKAGE_ARTIFACT_PATH=$artifact" >> $env:GITHUB_ENV

      - name: Upload release binaries
        if: runner.os == 'Linux' || runner.os == 'macOS'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: zz-${{ runner.os }}-${{ runner.arch }}-binaries
          path: ${{ env.ZZ_BINARY_ARTIFACT_PATH }}
          if-no-files-found: error
          archive: false

      - name: Upload distribution package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: zz-${{ runner.os }}-${{ runner.arch }}-package
          path: ${{ env.ZZ_PACKAGE_ARTIFACT_PATH }}
          if-no-files-found: error
          archive: false
