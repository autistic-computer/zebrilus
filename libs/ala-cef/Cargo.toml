[workspace]
exclude = ["third_party/cef-dll-sys"]

[package]
name = "ala-cef"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
description = "Chromium off-screen rendering for wgpu apps: CEF frames as GPU textures, input, profiles, cookies"
repository = "https://github.com/autistic-computer/ala-cef"
publish = false

[features]
default = ["cef-runtime"]
host = [
    "dep:ala",
    "dep:async-channel",
    "dep:base64",
    "dep:block2",
    "dep:objc2",
    "dep:objc2-core-foundation",
    "dep:objc2-io-surface",
    "dep:objc2-metal",
    "dep:pollster",
    "dep:wgpu",
]
cef-runtime = ["host", "dep:cef", "dep:ash"]

[dependencies]
async-channel = { version = "2.5.0", optional = true }
base64 = { version = "0.23.1", optional = true }
cef = { version = "=154.0.0", features = ["accelerated_osr"], optional = true }
log = "0.4.34"
parking_lot = "0.12.5"
pollster = { version = "1.0.1", optional = true }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
url = "=2.5.8"
wgpu = { version = "=30.0.1", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
getrandom = "0.4.3"

[target.'cfg(target_os = "linux")'.dependencies]
ash = { version = "0.38", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
ala = { git = "https://github.com/autistic-computer/ala", branch = "main", optional = true, features = ["default"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6.2", optional = true }
objc2 = { version = "0.6.4", optional = true }
objc2-core-foundation = { version = "0.3.2", optional = true, features = ["CFDictionary", "CFNumber", "CFString"] }
objc2-io-surface = { version = "0.3.2", optional = true }
objc2-metal = { version = "0.3.2", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[patch.crates-io]
cef-dll-sys = { path = "third_party/cef-dll-sys" }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
wildcard_imports = "allow"
enum_glob_use = "allow"
struct_field_names = "allow"
items_after_statements = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
result_large_err = "allow"
assert_is_empty = "allow"
unused_async_trait_impl = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
float_cmp = "allow"
struct_excessive_bools = "allow"
type_complexity = "allow"
used_underscore_binding = "allow"
unused_self = "allow"
