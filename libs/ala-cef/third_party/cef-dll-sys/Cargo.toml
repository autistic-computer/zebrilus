[package]
name = "cef-dll-sys"
version = "156.3.0+156.0.15"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
build = "build.rs"

[workspace]

[features]
dox = ["upstream/dox"]
sandbox = ["upstream/sandbox"]

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
upstream = { package = "cef-dll-sys", git = "https://github.com/tauri-apps/cef-rs", rev = "6805c90eb671b9664795f112dd2d7c966925426a", features = ["dox"] }
libloading = "0.9"

[target.'cfg(not(all(target_os = "linux", target_arch = "x86_64")))'.dependencies]
upstream = { package = "cef-dll-sys", git = "https://github.com/tauri-apps/cef-rs", rev = "6805c90eb671b9664795f112dd2d7c966925426a" }

[build-dependencies]
anyhow = "1"
download-cef = { git = "https://github.com/tauri-apps/cef-rs", rev = "6805c90eb671b9664795f112dd2d7c966925426a" }

[lib]
doctest = false
