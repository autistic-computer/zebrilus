[package]
name = "pele"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Native Rust port of Pele Mermaid rendering with static SVG output"
repository = "https://github.com/autistic-computer/pele-rs"
readme = "README.md"
publish = false

[workspace]
resolver = "3"

[dependencies]
indexmap = { version = "2", features = ["serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
svgtypes = "0.16"

[dev-dependencies]
resvg = { version = "0.46", default-features = false, features = ["text", "system-fonts"] }
roxmltree = "0.20"
serde_json = { version = "1", features = ["float_roundtrip"] }

[[bin]]
name = "pele"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
