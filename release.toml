allow-branch = ["main"]
consolidate-commits = true
pre-release-commit-message = "release: zz {{version}}"
publish = false
push = true
push-remote = "origin"
shared-version = "workspace"
tag = true
tag-message = "zz {{version}}"
tag-name = "v{{version}}"

[[pre-release-replacements]]
file = "../../clients/web/Cargo.lock"
search = '(?m)(name = "zz-(?:app|client|daemon-client|protocol|terminal|ui)"\nversion = ")[^"]+'
replace = '${1}{{version}}'
exactly = 6
prerelease = true

[[pre-release-replacements]]
file = "../../clients/storybook/Cargo.lock"
search = '(?m)(name = "zz-(?:client|protocol|terminal|ui)"\nversion = ")[^"]+'
replace = '${1}{{version}}'
exactly = 4
prerelease = true

[[pre-release-replacements]]
file = "../../README.md"
search = 'version:\x{a0}[0-9][^\x{a0}<]*\x{a0}*'
replace = "version:\u00a0{{version}}\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0"
exactly = 1
