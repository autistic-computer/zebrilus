[package]
name = "zz-ios"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "zz for iPhone and iPad: the entry point around zz-app and ala-platform"
publish = false

[target.'cfg(target_os = "ios")'.dependencies]
env_logger.workspace = true
futures.workspace = true
ala = { workspace = true, features = ["default"] }
ala-platform.workspace = true
penna.workspace = true
zz-app.workspace = true
zz-ui = { workspace = true, features = ["agent", "tree-sitter"] }

[target.'cfg(target_os = "ios")'.dev-dependencies]
image.workspace = true
zz-client.workspace = true
zz-daemon-client.workspace = true
zz-protocol.workspace = true
zz-terminal.workspace = true

[lints]
workspace = true
