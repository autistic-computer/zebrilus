<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zz</title>
<link rel="stylesheet" href="kit/penna.css">
<link rel="stylesheet" href="kit/slider.css">
<link rel="stylesheet" href="kit/zz.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/workspace.css">
<link rel="stylesheet" href="css/terminal.css">
<link rel="stylesheet" href="css/overlays.css">
<link rel="stylesheet" href="css/palette.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/agent.css">
<link rel="stylesheet" href="css/browser.css">
<script src="kit/kit.js" data-theme="default"></script>
</head>
<body>
<div class="penna-window app" data-penna="window">
  <nav data-penna="sidebar">
    <div class="penna-strip">
      <span data-penna="badge" data-tone="primary" id="prefix" hidden>prefix</span>
      <span class="grow"></span>
      <button data-penna="chrome.button" id="flat-list" title="Show chats"><i data-icon="chat"></i></button>
      <button data-penna="chrome.button" id="toggle-sidebar" title="Toggle sidebar"><i data-icon="panel-left-fill"></i></button>
    </div>
    <div class="sidebar-actions" id="sidebar-actions"></div>
    <div id="tree"></div>
    <span class="grow"></span>
    <div class="footer">
      <span class="penna-muted" id="status">Connecting…</span>
      <div class="sidebar-action" id="open-settings" role="button" aria-label="Settings"><span class="flat-fill" data-penna="row.nav"></span><i data-icon="settings" class="flat-glyph"></i><span>Settings</span></div>
    </div>
  </nav>
  <main id="workspace"></main>
</div>
<div id="overlays"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
