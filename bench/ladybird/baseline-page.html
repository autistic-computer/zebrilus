<!doctype html>
<meta charset="utf-8">
<title>Browser baseline</title>
<style>
  * { box-sizing: border-box }
  html { scrollbar-width: none }
  body { margin: 0; color: #fff; background: #194b70; font: 18px sans-serif }
  canvas { width: 100%; height: 240px; display: block }
  article { height: 52px; padding: 14px; border-left: 80px solid #d84f83; background: linear-gradient(100deg, #194b70, #273e5f) }
</style>
<canvas height="240"></canvas><main></main>
<script>
const area = document.querySelector('canvas');
const brush = area.getContext('2d');
const list = document.querySelector('main');
for (let row = 0; row < 180; ++row) {
  const article = document.createElement('article');
  article.textContent = 'Pane ' + (row + 1) + ' — Navigation, history, and profile storage.';
  list.append(article);
}
function paint(step) {
  brush.fillStyle = '#eeaf52';
  brush.fillRect(0, 0, area.width, area.height);
  brush.fillStyle = '#263947';
  brush.fillRect(step * 7 % (area.width - 80), 50, 80, 100);
}
const frame = () => new Promise(requestAnimationFrame);
const report = (key, value) => fetch('/' + key, {method: 'POST', body: JSON.stringify(value)});
function geometry() {
  return [innerWidth, innerHeight, devicePixelRatio, document.visibilityState];
}
function integerWork() {
  let hash = 2166136261;
  for (let i = 0; i < 96000000; ++i) hash = Math.imul(hash ^ i, 16777619) >>> 0;
  return hash;
}
function layoutWork() {
  const grid = document.createElement('div');
  grid.style.cssText = 'position:fixed;left:0;top:0;width:720px;display:grid;grid-auto-rows:10px;visibility:hidden';
  const cells = document.createDocumentFragment();
  for (let i = 0; i < 1200; ++i) cells.append(document.createElement('span'));
  grid.append(cells);
  document.body.append(grid);
  let checksum = 0;
  for (let pass = 0; pass < 48; ++pass) {
    grid.style.gridTemplateColumns = 'repeat(' + (6 + pass % 7) + ', 1fr)';
    checksum += grid.lastElementChild.offsetTop;
  }
  grid.remove();
  return checksum;
}
async function main() {
  await frame();
  await frame();
  area.width = innerWidth;
  paint(0);
  await report('ready', {geometry: geometry(), ua: navigator.userAgent, navigationMs: performance.now()});
  for (;;) {
    const {phase, frames, idleMs} = await (await fetch('/next', {cache: 'no-store'})).json();
    const times = [];
    let checksum = null;
    let elapsedMs = null;
    if (phase === 'integer' || phase === 'layout') {
      const start = performance.now();
      checksum = phase === 'integer' ? integerWork() : layoutWork();
      elapsedMs = performance.now() - start;
    } else if (phase === 'idle') {
      await new Promise(resolve => setTimeout(resolve, idleMs));
    } else {
      let previous = await frame();
      for (let step = 1; step <= frames; ++step) {
        if (phase === 'canvas') paint(step);
        else scrollTo(0, 16 * step);
        const now = await frame();
        times.push(now - previous);
        previous = now;
      }
    }
    await report('done', {phase, times, checksum, elapsedMs, y: scrollY, geometry: geometry()});
  }
}
main().catch(e => report('error', String(e)));
</script>
