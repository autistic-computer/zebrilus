<title>Chat rows</title>

<link rel="stylesheet" href="/penna-src/components/button/button.css">
<link rel="stylesheet" href="/penna-src/components/kbd/kbd.css">
<link rel="stylesheet" href="/penna-src/components/menu/menu.css">
<link rel="stylesheet" href="/penna-src/components/spinner/spinner.css">

<style>
  .zz-page { display: grid; gap: 28px; max-width: 1760px; margin: 0 auto; padding: 40px 32px 96px; }
  .zz-page h1 { margin: 0; font-size: var(--penna-text-title-size); line-height: var(--penna-text-title-line); font-weight: 600; }
  .zz-page h2 { margin: 0; font-size: 15px; line-height: 20px; font-weight: 600; }
  .zz-intro p { margin: 4px 0 0; max-width: 100ch; color: var(--penna-fg-muted); }
  .zz-intro a { color: var(--penna-fg); }

  .zz-board { display: grid; grid-template-columns: repeat(3, 256px) minmax(620px, 1fr); gap: 36px 32px; align-items: start; }
  .zz-cell { display: grid; grid-template-rows: auto 1fr; gap: 8px; align-self: stretch; min-width: 0; }
  .zz-cap { margin: 0; font-size: var(--penna-text-small-size); line-height: var(--penna-text-small-line); color: var(--penna-fg-muted); white-space: nowrap; }
  .zz-aside { display: grid; gap: 12px; align-content: start; min-width: 0; }
  .zz-decided { display: grid; gap: 8px; margin: 0; padding-left: 18px; color: var(--penna-fg-muted); }
  .zz-decided b { color: var(--penna-fg); font-weight: 600; }
  .zz-spec { width: 100%; border-collapse: collapse; font-size: var(--penna-text-small-size); line-height: var(--penna-text-small-line); }
  .zz-spec th, .zz-spec td { padding: 5px 12px 5px 0; text-align: left; vertical-align: top; border-bottom: 1px solid var(--penna-divider); }
  .zz-spec th { font-weight: 600; color: var(--penna-fg); }
  .zz-spec td { color: var(--penna-fg-muted); }
  .zz-spec td:first-child { color: var(--penna-fg); white-space: nowrap; }
  .zz-spec td:last-child { font-family: var(--penna-mono); font-size: 11px; }

  .zz-side.penna-window { grid-template-columns: 256px; grid-template-rows: 40px auto; width: 256px; }
  .zz-nav[data-penna="sidebar"] { display: flex; flex-direction: column; gap: 0; height: 100%; min-height: 0; padding: 0; --zz-ground: var(--penna-fill); }
  .zz-nav > .penna-strip { padding-right: 10px; }
  .zz-nav [data-penna="chrome.button"] { display: grid; place-items: center; padding: 0; color: var(--penna-fg-muted); }
  .zz-actions { display: flex; flex: none; flex-direction: column; padding: 0 8px 8px 0; }
  .zz-foot { display: flex; flex: none; flex-direction: column; margin-top: auto; padding: 16px 8px 6px 0; }
  .zz-action[data-penna] { height: 32px; margin: 0 var(--penna-row-inset); padding: 0 10px; gap: 8px; font-size: 13px; line-height: 16px; --penna-icon-size: 16px; cursor: var(--penna-click-cursor); }
  .zz-list { position: relative; display: flex; flex-direction: column; padding-right: 8px; }

  .zz-host { display: flex; flex: none; align-items: center; gap: 8px; height: 30px; padding: 0 16px; font-size: 13px; font-weight: 600; line-height: 16px; color: color-mix(in oklab, var(--penna-fg) 85%, transparent); }
  .zz-list > :not(.zz-host) + .zz-host { margin-top: 18px; }
  .zz-host > [data-icon] { color: var(--penna-fg-muted); --penna-icon-size: 16px; }

  .zz-group { position: relative; display: flex; flex-direction: column; --zz-track: var(--penna-divider); }
  .zz-group[data-lit] { --zz-track: var(--penna-fg-muted); }
  .zz-group::before { content: ""; position: absolute; z-index: 1; top: 42px; bottom: 4px; left: 29.75px; width: 0.5px; background: var(--zz-track); pointer-events: none; }
  .zz-group[data-ticks]::before { bottom: 16px; }
  .zz-group[data-ticks] .zz-nest::before { content: ""; position: absolute; top: calc(50% - 0.25px); left: 23.75px; width: 5.25px; height: 0.5px; background: var(--zz-track); }

  .zz-row[data-penna="row.nav"] { position: relative; flex: none; flex-direction: row; align-items: center; justify-content: flex-start; gap: 10px; height: 46px; margin: 1px var(--penna-row-inset); padding: 0 13px 0 10px; font-weight: 400; cursor: var(--penna-click-cursor); --zz-row-fill: var(--penna-fill); }
  .zz-row.zz-nest[data-penna="row.nav"] { height: 30px; padding-left: 32px; gap: 10px; }
  .zz-stack { position: relative; flex: none; width: 42px; height: 28px; }
  .zz-lead { position: relative; flex: none; height: 20px; }
  .zz-tile[data-penna] { position: absolute; top: 0; display: grid; place-items: center; width: 28px; height: 28px; background: linear-gradient(color-mix(in srgb, var(--penna-fg) 6%, var(--penna-fill)), var(--penna-fill)); box-shadow: 0 0 0 0.5px color-mix(in srgb, var(--penna-fg) 16%, transparent), var(--penna-shadow-contact); --penna-icon-size: 16px; }
  .zz-lead > .zz-tile[data-penna] { width: 20px; height: 20px; --penna-icon-size: 14px; }
  .zz-dot { position: absolute; right: -2.5px; bottom: -2.5px; display: grid; place-items: center; width: 11px; height: 11px; border-radius: 50%; background: linear-gradient(var(--zz-row-fill), var(--zz-row-fill)), var(--zz-ground); }
  .zz-dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--zz-tone); }
  .zz-lead .zz-dot { width: 9px; height: 9px; }
  .zz-lead .zz-dot::after { width: 6px; height: 6px; }
  [data-tone="accent"] { --zz-tone: var(--penna-accent); }
  [data-tone="warning"] { --zz-tone: var(--penna-warning); }
  [data-tone="danger"] { --zz-tone: var(--penna-danger); }
  [data-tone="success"] { --zz-tone: var(--penna-success); }
  [data-tone="primary"] { --zz-tone: var(--penna-primary); }

  .zz-text { display: flex; flex: 1; flex-direction: column; gap: 1px; min-width: 0; }
  .zz-title { display: flex; align-items: center; gap: 6px; height: 17px; font-size: 13px; font-weight: 500; line-height: 17px; }
  .zz-row[data-plain] .zz-title, .zz-nest[data-plain] .zz-label { font-weight: 400; }
  .penna-spinner { color: var(--penna-muted); }
  .zz-label, .zz-parts { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; -webkit-mask-image: linear-gradient(to left, transparent, #000 16px); mask-image: linear-gradient(to left, transparent, #000 16px); }
  .zz-line { display: flex; align-items: center; gap: 8px; height: 15px; font-size: 12px; line-height: 15px; color: var(--penna-muted); }
  .zz-parts > [data-tone="normal"] { color: var(--penna-ink); }
  .zz-parts > [data-tone="warning"] { color: var(--penna-warning); }
  .zz-parts > [data-tone="danger"] { color: var(--penna-danger); }
  .zz-age { flex: none; font-size: 11px; font-variant-numeric: tabular-nums; color: var(--penna-muted); }
  .zz-one { display: flex; flex: 1; align-items: center; gap: 8px; min-width: 0; height: 17px; font-size: 13px; font-weight: 500; line-height: 17px; }
  .zz-word { flex: none; font-size: 11px; color: var(--zz-tone); }
  .zz-word[data-tone="primary"] { color: var(--penna-ink); }
  .zz-chev { flex: none; color: var(--penna-muted); visibility: hidden; --penna-icon-size: 10px; }
  .zz-chev[data-open] { transform: rotate(90deg); }
  .zz-chev[data-state~="hover"] { color: var(--penna-ink); }
  .zz-row:is(:hover, [data-state~="hover"]) .zz-chev, .zz-chev[data-open] { visibility: visible; }
  .zz-row > .penna-kbd { display: none; flex: none; }
  .zz-side[data-keys] .zz-row > .penna-kbd { display: inline-flex; }
  .zz-side[data-keys] .zz-row:has(> .penna-kbd) .zz-age { display: none; }
  .zz-pointer { position: absolute; z-index: 9; width: 12px; height: 18px; pointer-events: none; background: var(--penna-fg); clip-path: polygon(0 0, 0 15px, 4px 11px, 7px 18px, 9px 17px, 6px 10px, 11px 10px); filter: drop-shadow(0 0 1px var(--penna-bg)); }

  .zz-snip { position: relative; align-self: start; width: 256px; }
  .zz-snip > .zz-nav[data-penna] { padding: 12px 0; border-radius: calc(12px * var(--penna-corner-grow, 1)); corner-shape: superellipse(var(--penna-window-k, 2)); }

  .zz-work.penna-window { grid-template-columns: 1fr; grid-template-rows: 1fr; height: 560px; }
  .zz-panes { display: grid; grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) 160px; gap: 1px; min-height: 0; background: var(--penna-divider); }
  .zz-panes > [data-penna="pane"] { position: relative; background: var(--penna-bg); }
  .zz-panes [data-penna="button.title"] { max-width: 240px; }
  .zz-panes [data-penna="button.title"] > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .zz-panes [data-penna="bar.pane"] > .zz-grow { flex: 1; }
  .zz-terminal [data-ink="muted"] { color: var(--penna-fg-muted); }
  .zz-terminal [data-ink="accent"] { color: var(--penna-accent-ink); }
  .zz-terminal [data-ink="success"] { color: var(--penna-success-ink); }
  .zz-terminal [data-ink="cursor"] { background: var(--penna-fg); color: var(--penna-bg); }
  .zz-vim { display: flex; flex-direction: column; }
  .zz-vim > .zz-code { flex: 1; }
</style>
</head>
<body>
<main class="zz-page">
  <div class="zz-intro">
    <h1>Chat rows</h1>
    <p>The pick, drawn as the spec for the build. Chat windows are rows; the windows without a chat fold into one last row per machine; any row with more than one pane opens into one-line rows on a track. The takes it came from: <a href="windows.html">Chat windows</a> and <a href="stack.html">Chat stacks</a>.</p>
  </div>
  <div class="zz-board" data-board></div>
</main>

    .join("\n");
  document.head.append(marks);

  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const ic = (name, extra = "") => `<i data-icon="${name}"${extra}></i>`;
  const LOUD = new Set(["warning", "danger", "primary"]);
  const RANK = ["primary", "success", "accent", "danger", "warning"];

  const chat = (title, extra = {}) => ({ kind: "chat", agent: "zz-claude", title, ...extra });
  const term = (title, icon = "terminal", extra = {}) => ({ kind: "term", icon, title, ...extra });
  const web = (title, host, extra = {}) => ({ kind: "web", icon: "globe", title, host, ...extra });

  const HOSTS = [
    { name: "macbook", icon: "zz-macos" },
    { name: "ubuntu", icon: "zz-ubuntu" },
  ];
  const WINDOWS = [
    { host: 0, place: ["zebrilus", "hit-tests"], panes: [chat("Fix stack hit tests", { detail: [["Running the tests"]], tone: "accent", working: true, age: "now" })] },
    { host: 0, place: ["zebrilus", "main"], current: true, panes: [term("nvim flat.rs", "zz-neovim", { age: "2m" }), term("cargo watch -x check", "zz-rust", { age: "2m" })] },
    { host: 0, place: ["zebrilus", "bento"], panes: [chat("Port bento to penna", { age: "12m" }), term("vite", "terminal", { age: "12m" }), term("zsh", "terminal", { age: "1h" })] },
    { host: 0, place: ["docs.rs"], panes: [web("ala - Rust", "docs.rs", { age: "40m" })] },
    { host: 0, place: ["zebrilus", "pill-menu"], focus: 1, panes: [chat("Pill menu New chat", { age: "4m" }), chat("Review the pill diff", { age: "now" }), term("cargo test -p zz-ui", "zz-rust", { age: "6m" })] },
    { host: 0, place: ["zebrilus", "main"], focus: 1, panes: [chat("Plan the chat rows", { age: "1h" }), chat("What the kit draws", { detail: [["Needs approval", "warning"], [" · rg guide"]], tone: "warning", word: "Needs you", age: "now" })] },
    { host: 0, place: ["~/dev"], panes: [term("zsh", "terminal", { age: "3h" })] },
    { host: 1, place: ["~"], panes: [term("bash", "terminal", { age: "5d" })] },
    { host: 1, place: ["packaging", "main"], panes: [chat("Bump arch package", { agent: "zz-openai", detail: [["Done", "normal"], [" · PKGBUILD"]], tone: "success", age: "2h" }), web("AUR (en) - zz", "aur.archlinux.org", { age: "2h" })] },
    { host: 1, place: ["release", "main"], panes: [chat("Tidy release notes", { age: "1d" })] },
  ];
  const SPLIT = 4;
  const FORK = 5;
  const NVIM = 1;
  const attention = () => {
    const windows = structuredClone(WINDOWS);
    windows[FORK].focus = 0;
    Object.assign(windows[6].panes[0], { tone: "primary", word: "Bell", detail: [["Bell", "normal"], [" · ~/dev"]], age: "now" });
    return windows;
  };

  const isChat = (pane) => pane.kind === "chat";
  const hasChat = (win) => win.panes.some(isChat);
  const focusOf = (win) => win.focus ?? 0;
  const frontOf = (win) => (hasChat(win) && !isChat(win.panes[focusOf(win)]) ? win.panes.findIndex(isChat) : focusOf(win));
  const order = (win) => {
    const front = frontOf(win);
    const rest = win.panes.map((_, index) => index).filter((index) => index !== front);
    return [front, ...rest.filter((index) => isChat(win.panes[index])), ...rest.filter((index) => !isChat(win.panes[index]))];
  };
  const loudest = (panes) => panes.map((pane) => pane.tone).filter(Boolean).sort((a, b) => RANK.indexOf(b) - RANK.indexOf(a))[0];
  const iconOf = (pane) => (isChat(pane) ? pane.agent : pane.icon);
  const placeOf = (win) => win.place.join(" · ");
  const facesOf = (win) => order(win).map((index) => ({ icon: iconOf(win.panes[index]), tone: win.panes[index].tone }));
  const headline = (win, open = false) => {
    const front = frontOf(win);
    const lead = win.panes[front];
    const behind = open ? null : win.panes.find((pane, index) => index !== front && LOUD.has(pane.tone));
    const detail = behind ? [behind.detail[0], [` · ${behind.title}`]] : (lead.detail ?? [[placeOf(win)]]);
    return { title: lead.title, detail, age: lead.age, working: lead.working, plain: !hasChat(win) };
  };

  const dot = (tone) => (tone ? `<span class="zz-dot" data-tone="${tone}"></span>` : "");
  const tiles = (faces, step) => faces.slice(0, 3).map((face, slot) => `<span class="zz-tile" data-penna="tile.stack" style="left: ${slot * step}px; z-index: ${10 - slot}">${slot === 0 ? ic(face.icon) : ""}${dot(face.tone)}</span>`).join("");
  const stack = (faces) => `<span class="zz-stack">${tiles(faces, 7)}</span>`;
  const lead = (faces, room) => `<span class="zz-lead" style="width: ${20 + (room - 1) * 5}px">${tiles(faces, 5)}</span>`;
  const parts = (detail) => detail.map(([part, tone = "muted"]) => `<span data-tone="${tone}">${esc(part)}</span>`).join("");
  const chevron = (open, hover) => ic("chevron-right", ` class="zz-chev"${open ? " data-open" : ""}${hover ? ` data-state="hover"` : ""}`);
  const spinner = `<span class="penna-spinner" data-size="small">${ic("loader")}</span>`;
  const kbd = (number) => (number ? `<kbd class="penna-kbd" data-penna="keycap" data-size="small" data-kbd="cmd-${number}"></kbd>` : "");
  const states = (...list) => {
    const value = list.filter(Boolean).join(" ");
    return value ? ` data-state="${value}"` : "";
  };
  const pointer = (x, y) => `<span class="zz-pointer" style="left: ${x}px; top: ${y}px"></span>`;

  const mainRow = ({ faces, body, current, hover, plain, number, chev = "", extra = "" }) =>
    `<div class="zz-row" data-penna="row.nav" role="button"${states(current && "current", hover && "hover")}${plain ? " data-plain" : ""}>${stack(faces)}<span class="zz-text"><span class="zz-title"><span class="zz-label" data-penna-text>${esc(body.title)}</span>${body.working ? spinner : ""}${chev}</span><span class="zz-line"><span class="zz-parts">${parts(body.detail)}</span>${body.age ? `<span class="zz-age">${body.age}</span>` : ""}</span></span>${kbd(number)}${extra}</div>`;
  const trailing = ({ word, tone, working, age }) => (word ? `<span class="zz-word" data-tone="${tone}">${word}</span>` : working ? spinner : age ? `<span class="zz-age">${age}</span>` : "");
  const nestRow = ({ faces, room, title, plain, current, hover, tail, extra = "" }) =>
    `<div class="zz-row zz-nest" data-penna="row.nav" role="button"${states(current && "current", hover && "hover")}${plain ? " data-plain" : ""}>${lead(faces, room)}<span class="zz-one"><span class="zz-label" data-penna-text>${esc(title)}</span>${tail}</span>${extra}</div>`;

  const windowGroup = (win, { number, open = false, hover = null, chevHover = false, ticks = false }) => {
    const several = win.panes.length > 1;
    const head = mainRow({
      faces: facesOf(win),
      body: headline(win, open),
      current: win.current && !open,
      hover: chevHover,
      plain: !hasChat(win),
      number: hasChat(win) ? number : null,
      chev: several ? chevron(open, chevHover) : "",
      extra: chevHover ? pointer(221, 19) : "",
    });
    if (!open) return head;
    const nested = win.panes.map((pane, index) => nestRow({
      faces: [{ icon: iconOf(pane), tone: pane.tone }],
      room: 1,
      title: pane.title,
      plain: !isChat(pane),
      current: win.current && index === focusOf(win),
      hover: hover === index,
      tail: trailing(pane),
      extra: hover === index ? pointer(140, 12) : "",
    })).join("");
    const lit = win.current;
    return `<div class="zz-group"${lit ? " data-lit" : ""}${ticks ? " data-ticks" : ""}>${head}${nested}</div>`;
  };
  const pileGroup = (wins, { open = false } = {}) => {
    const first = Math.max(0, wins.findIndex((win) => win.current));
    const piled = [wins[first], ...wins.filter((_, index) => index !== first)];
    const faces = piled.map((win) => ({ icon: iconOf(win.panes[frontOf(win)]), tone: loudest(win.panes) }));
    const top = headline(piled[0]);
    const behind = open ? null : piled.slice(1).find((win) => LOUD.has(loudest(win.panes)));
    const detail = behind ? [headline(behind).detail[0], [` · ${headline(behind).title}`]] : top.detail;
    const head = mainRow({ faces, body: { ...top, detail }, current: !open && wins.some((win) => win.current), plain: true, chev: chevron(open) });
    if (!open) return head;
    const room = Math.min(3, Math.max(...wins.map((win) => win.panes.length)));
    const nested = wins.map((win) => {
      const loud = win.panes.find((pane) => LOUD.has(pane.tone));
      const front = win.panes[frontOf(win)];
      return nestRow({ faces: facesOf(win), room, title: front.title, plain: true, current: win.current, tail: trailing(loud ?? front) });
    }).join("");
    return `<div class="zz-group"${wins.some((win) => win.current) ? " data-lit" : ""}>${head}${nested}</div>`;
  };

  const action = (icon, label) => `<div class="zz-action" data-penna="sidebar.row" role="button">${ic(icon)}<span data-penna-text>${label}</span></div>`;
  const listHtml = (windows, { open = new Set(), pile = false, hover = null, chevHover = null, ticks = false } = {}) => {
    let number = 0;
    return HOSTS.map((host, hostIndex) => {
      const mine = windows.map((win, at) => ({ win, at })).filter(({ win }) => win.host === hostIndex);
      const chats = mine.filter(({ win }) => hasChat(win));
      const plain = mine.filter(({ win }) => !hasChat(win)).map(({ win }) => win);
      const rows = chats.map(({ win, at }) => windowGroup(win, {
        number: ++number <= 9 ? number : null,
        open: open.has(at),
        hover: hover && hover[0] === at ? hover[1] : null,
        chevHover: chevHover === at,
        ticks,
      })).join("");
      const tail = plain.length > 1 ? pileGroup(plain, { open: pile && hostIndex === 0 }) : plain.map((win) => windowGroup(win, {})).join("");
      return `<div class="zz-host" role="button">${ic(host.icon)}<span data-penna-text>${host.name}</span></div>${rows}${tail}`;
    }).join("");
  };
  const sidebar = (windows, options = {}, keys = false) => `<div class="penna-window zz-side" data-penna="window"${keys ? " data-keys" : ""}><div class="penna-lights"><i></i><i></i><i></i></div><nav class="zz-nav" data-penna="sidebar"><div class="penna-strip"><button data-penna="chrome.button" aria-label="Show the session tree">${ic("chat-fill")}</button><button data-penna="chrome.button" aria-label="Hide the sidebar">${ic("panel-left")}</button></div><div class="zz-actions">${action("chat-plus", "New chat")}${action("server-plus", "Add host")}</div><div class="zz-list">${listHtml(windows, options)}</div><div class="zz-foot">${action("settings", "Settings")}</div></nav></div>`;
  const cell = (caption, html) => `<div class="zz-cell"><p class="zz-cap">${caption}</p>${html}</div>`;

  const ticks = () => {
    const win = WINDOWS[SPLIT];
    return `<div class="zz-snip"><nav class="zz-nav" data-penna="sidebar"><div class="zz-list">${windowGroup(win, { number: 3, open: true, ticks: true })}${windowGroup(WINDOWS[FORK], { number: 4 })}</div></nav></div>`;
  };

  const header = (icon, title) => `<div data-penna="bar.pane"><div data-penna="button.title">${ic(icon)}<span>${esc(title)}</span></div><span class="zz-grow"></span><button data-penna="icon-button.bar" aria-label="Pane menu">${ic("ellipsis")}</button></div>`;
  const CODE = [
    "#[derive(Clone, Copy, Debug, Default, PartialEq, Eq)]",
    "pub struct FlatState {",
    "    pub current: Option<(PaletteHostId, WindowId)>,",
    "    pub selected: Option<(PaletteHostId, WindowId)>,",
    "    pub hovered: Option<FlatTarget>,",
    "}",
    "",
    "impl FlatState {",
    "    pub fn hover(&mut self, target: FlatTarget, hovered: bool) -> bool {",
    "        let next = if hovered {",
    "            Some(target)",
    "        } else if self.hovered == Some(target) {",
    "            None",
    "        } else {",
    "            self.hovered",
    "        };",
    "        std::mem::replace(&mut self.hovered, next) != next",
    "    }",
    "}",
  ];
  const vim = CODE.map((line, index) => {
    const number = String(160 + index).padStart(4);
    const body = index === 3 ? `    pub <span data-ink="cursor">s</span>${esc(line.slice(9))}` : esc(line);
    return `<span data-ink="muted">${number}</span>  ${body}`;
  }).join("\n");
  const workspace = `<div class="penna-window zz-work" data-penna="window"><div class="zz-panes">
    <section data-penna="pane">${header("zz-neovim", WINDOWS[NVIM].panes[0].title)}<pre class="zz-terminal zz-vim"><span class="zz-code">${vim}</span><span><span data-ink="accent">NORMAL</span>  <span data-ink="muted">flat.rs                                          163:9</span></span></pre></section>
    <section data-penna="pane">${header("zz-rust", WINDOWS[NVIM].panes[1].title)}<pre class="zz-terminal"><span data-ink="muted">[Running 'cargo check -p zz-ui']</span>
    Checking zz-ui v0.42.0 (crates/zz-ui)
<span data-ink="success">    Finished</span> \`dev\` profile in 3.84s
<span data-ink="muted">[Finished running. Exit status: 0]</span></pre></section>
  </div></div>`;

  const decided = `<ul class="zz-decided">
    <li><b>Clicks.</b> A window row shows its window with focus where it was. The chevron only opens and closes. A nested chat, terminal or browser row shows its window and focuses that pane. A nested window row in the pile shows that window. A face, in any stack, focuses its pane; pointing at a stack lays its faces out as today. The pile row shows its front window, the plain window used last.</li>
    <li><b>Current marker.</b> Closed window: on the window row. Open window: on the focused pane's nested row, the window row at rest and the track lit. Closed pile: on the pile row. Open pile: on the window's nested row, the track lit.</li>
    <li><b>Chevron.</b> Only on a window with two or more panes and on a pile of two or more windows; it shows on hover and stays while open. A machine with one plain window shows that window, with no pile.</li>
    <li><b>Opening keeps the parent row.</b> Same face, title and age; only a "behind" second line goes back to the front pane's own, since nothing is hidden once open. The pile row keeps the front window's title; no count.</li>
    <li><b>Nested rows.</b> One line: face with its dot, title, and one trailing thing: the short status word in its tone (Needs you, Failed, Bell), else a spinner while running, else the age. The full status stays on the window row's second line while closed. A nested window shows its own small stack and never opens a second level.</li>
    <li><b>Row menu.</b> A window row: Rename, Close window. The pile row and nested rows have none.</li>
    <li><b>⌘ badges.</b> Chat window rows only, top to bottom across machines; plain windows, the pile and nested rows take none.</li>
  </ul>`;
  const SPEC = [
    ["Sidebar", "256 wide; list right gutter 8; x below is from the sidebar's left edge", "SIDEBAR_DEFAULT_WIDTH, SIDEBAR_SCROLLBAR_GUTTER"],
    ["Row fill", "inset 6 left and right, 1 top and bottom; row.nav look", "theme.row_inset, WORKSPACE_TREE_FILL_VERTICAL_INSET"],
    ["Window row", "48 high; content from x 16 (6 + 10); trailing pad 19", "ROW_HEIGHT, ROW_PADDING, row_trailing_inset"],
    ["Window stack", "tile 28, glyph 16, step 7, room 3 = 42 wide, x 16 to 58", "StackSize::Row"],
    ["Window text", "x 68 (stack + gap 10); title Body 13/17 medium; second line Small 12/15, gap 1", "TILE_GAP, TITLE_LINE, DETAIL_LINE, LINE_GAP"],
    ["Age, badge", "Caption 11 tabular, gap 8; ⌘ cap (Kbd small) replaces the age", "AGE, DETAIL_AGE_GAP, window_shortcut_cap"],
    ["Chevron", "Disclosure 10 after the title, gap 6; foreground.muted, foreground on hover; turns 90° open", "CHEVRON_SIZE, TITLE_TRAILING_GAP"],
    ["Status dot", "round(tile × 0.3), min 5: 8 on 28, 6 on 20; ring 1.5 in the row's ground; offset −2.5 right and bottom", "DOT_SHARE, DOT_RING, DOT_OVERHANG"],
    ["Nested row", "32 high, one line, same row.nav fill and insets", "new; = WORKSPACE_TREE_ROW_HEIGHT"],
    ["Nested lead", "x 38 = 68 − 10 − 20; tile 20, glyph 14, step 5; a pile's rows reserve its widest stack, up to 30", "new; StackSize::Bar"],
    ["Nested text", "x = 38 + stack width + 10: 68 after one face, lining up with the window title; 73 after two, 78 after three. Body 13/17, medium for chats, regular otherwise", "new"],
    ["Nested trailing", "one of: status word Caption 11 in its tone, spinner 12, age Caption 11 tabular; gap 8; trailing pad 19", "new"],
    ["Track", "x 30 = 6 + 10 + 28/2, the front tile's center; 1 device px wide", "new; IndentGuides hairline"],
    ["Track length", "from the parent row's top + 42 (stack bottom + 4) to the last nested row's bottom − 4", "TREE_INDENT_GUIDE_PADDING"],
    ["Track color", "rest: divider color, hidden when rule.tree draws no outline; lit: foreground.muted while the current row is nested in it", "IndentGuideColors::tree"],
    ["Track tick, alt", "1 device px from x 30 to 35 at each nested row's middle; the track ends at the last tick", "new"],
    ["Machine header", "30 high, glyph 16, gap 8; 18 between machines", "HOST_HEIGHT, HOST_GLYPH, HOST_SPACING, HOST_GAP"],
  ];
  const spec = `<table class="zz-spec"><thead><tr><th>Part</th><th>Value (px)</th><th>From</th></tr></thead><tbody>${SPEC.map(([part, value, from]) => `<tr><td>${part}</td><td>${value}</td><td>${from}</td></tr>`).join("")}</tbody></table>`;

  const AT = attention();
  const cells = [
    cell("At rest", sidebar(WINDOWS)),
    cell("The split chats opened", sidebar(WINDOWS, { open: new Set([SPLIT]) })),
    cell("The pile opened, nvim current", sidebar(WINDOWS, { pile: true })),
    `<div class="zz-aside"><p class="zz-cap">The plain window on screen</p>${workspace}</div>`,
    cell("Both opened", sidebar(WINDOWS, { open: new Set([SPLIT]), pile: true })),
    cell("Bell in the pile, fork behind needs approval", sidebar(AT)),
    cell("The same, both parents opened", sidebar(AT, { open: new Set([FORK]), pile: true })),
    `<div class="zz-aside"><h2>Decided</h2>${decided}</div>`,
    cell("Pointer on a nested row, then a chevron", sidebar(WINDOWS, { open: new Set([SPLIT]), hover: [SPLIT, 0], chevHover: FORK })),
    cell("⌘ held, both opened", sidebar(WINDOWS, { open: new Set([SPLIT]), pile: true }, true)),
    cell("Alternative: a tick into each row", ticks()),
    `<div class="zz-aside"><h2>Numbers</h2>${spec}</div>`,
  ];
  document.querySelector("[data-board]").innerHTML = cells.join("");
})();
</script>
</body>
</html>
