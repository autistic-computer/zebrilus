<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat visuals and page frames: final</title>
<link rel="stylesheet" href="/penna/penna.css">
<link rel="stylesheet" href="/penna-src/components/card/card.css">
<link rel="stylesheet" href="/penna-src/components/badge/badge.css">
<link rel="stylesheet" href="/penna-src/components/progress/progress.css">
<link rel="stylesheet" href="/penna-src/components/segmented/segmented.css">
<link rel="stylesheet" href="/penna-src/components/slider/slider.css">
<link rel="stylesheet" href="/penna-src/components/spinner/spinner.css">
<link rel="stylesheet" href="/penna-src/blocks/chat/chat.css">
<link rel="stylesheet" href="/zz.css">
<script src="/penna/kit.js" data-tokens="/tokens/" data-themes="macos default yaru" data-theme="macos"></script>
<style>
  [hidden] { display: none !important; }
  .zz-page { display: grid; gap: 56px; max-width: 2000px; margin: 0 auto; padding: 40px 32px 96px; }
  .zz-page > section { display: grid; gap: 14px; min-width: 0; }
  .zz-page h1 { margin: 0; font-size: var(--penna-text-title-size, 22px); line-height: var(--penna-text-title-line, 28px); font-weight: 600; }
  .zz-page h2 { margin: 0; font-size: 15px; line-height: 20px; font-weight: 600; }
  .zz-page p.zz-lede { margin: 0; max-width: 96ch; color: var(--penna-fg-muted); }
  .zz-page p.zz-lede b { color: var(--penna-fg); font-weight: 600; }
  .zz-intro { display: grid; gap: 6px; }
  .zz-pick { margin-left: 6px; color: var(--penna-accent); font-weight: 600; }

  .zz-variants.penna-variants { padding: 0; --penna-variant-width: 600px; }
  .zz-variants > figure { min-width: 0; }
  .zz-states.penna-variants { --penna-variant-width: 440px; }
  .zz-one.penna-variants { --penna-variant-width: 900px; }

  .zz-chat { display: flex; flex-direction: column; gap: 12px; min-width: 0; padding: 20px 24px; border: 1px solid var(--penna-border); border-radius: 14px; background: var(--penna-bg); font-size: var(--penna-text-read-body-size); line-height: var(--penna-text-read-body-line); }
  .zz-chat > p { margin: 0; }
  .zz-chat .penna-chat-bubble { width: fit-content; }
  .zz-chat .penna-chat-message { margin-bottom: 4px; }

  .zv { position: relative; display: grid; gap: 12px; min-width: 0; font-size: var(--penna-text-body-size); line-height: var(--penna-text-body-line); }
  .zv-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .zv-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .zv-tile.penna-card[data-penna] { display: grid; gap: 6px; min-width: 0; padding: 12px; overflow: hidden; }
  .zv > .penna-card { min-width: 0; overflow: hidden; }
  .zv-tile-head { display: flex; align-items: center; gap: 6px; min-height: 20px; color: var(--penna-muted); font-size: var(--penna-text-small-size); line-height: var(--penna-text-small-line); }
  .zv-tile-head > b { font-weight: 500; }
  .zv-stat { font-size: 22px; line-height: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .zv-stat > small { margin-left: 3px; font-size: var(--penna-text-small-size); font-weight: 400; color: var(--penna-muted); }
  .zv-wrap.penna-card[data-penna] { padding: 12px; }
  .zv-wrap .zv-tile.penna-card[data-penna] { padding: 10px 12px; }

  .zv-tools[data-penna="popover"] { position: absolute; top: -8px; right: -8px; z-index: 1; display: flex; flex-direction: row; gap: 2px; width: auto; min-width: 0; padding: 2px; }
  .zv-tools > [data-penna] { width: 24px; height: 24px; --penna-icon-size: 13px; }
  .zv-live { outline: 1.5px solid var(--penna-focus-neutral); outline-offset: 6px; border-radius: 6px; }

  .zb.penna-card[data-penna] { display: flex; flex-direction: column; gap: 10px; padding: 10px 12px 12px; }
  .zb-head { display: flex; align-items: center; gap: 2px; height: 22px; }
  .zb-head > span { flex: 1; font-family: var(--penna-mono); font-size: var(--penna-text-micro-size); letter-spacing: 0.04em; color: var(--penna-muted); }
  .zb-head > [data-penna] { width: 22px; height: 22px; --penna-icon-size: 13px; }
  .zb-shot { padding: 14px; background: var(--penna-bg); }
  .zb-code { margin: 0; overflow: hidden; font-family: var(--penna-mono); font-size: var(--penna-text-mono-size); line-height: var(--penna-text-mono-line); white-space: pre; color: var(--penna-fg); }
  .zb-code i { font-style: normal; color: var(--penna-syntax-tag); }
  .zb-code u { text-decoration: none; color: var(--penna-syntax-attribute); }
  .zb-code s { text-decoration: none; color: var(--penna-syntax-string); }

  .old { display: grid; gap: 12px; font: 14px/1.5 system-ui, sans-serif; color: var(--penna-fg); }
  .old-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .old-pills { display: flex; gap: 4px; }
  .old-link { padding: 4px 12px; border-radius: 8px; color: var(--penna-fg-muted); }
  .old-link[data-on] { color: var(--penna-fg); background: color-mix(in srgb, var(--penna-fg) 10%, transparent); }
  .old-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .old-card { padding: 12px 14px; border: 1px solid var(--penna-border); border-radius: 10px; background: color-mix(in srgb, var(--penna-fg) 4%, var(--penna-bg)); }
  .old-card > div:first-child { font-size: 12px; color: var(--penna-fg-muted); }
  .old-stat { font-size: 1.6em; font-weight: 500; font-variant-numeric: tabular-nums; }
  .old-progress { height: 6px; margin-top: 6px; border-radius: 3px; background: color-mix(in srgb, var(--penna-fg) 10%, transparent); overflow: hidden; }
  .old-progress > div { height: 100%; background: var(--penna-accent); }
  .old-badge { display: inline-block; margin-left: 6px; padding: 0 8px; border-radius: 999px; background: color-mix(in srgb, var(--penna-fg) 10%, transparent); font-size: 12px; }
  .old-btn { padding: 4px 12px; border: 1px solid var(--penna-border); border-radius: 8px; background: color-mix(in srgb, var(--penna-fg) 8%, transparent); }
  .old-btn[data-primary] { border-color: var(--penna-accent); background: var(--penna-accent); color: var(--penna-on-accent); }

  .pg { width: 900px; background: #faf6f0; color: #2a211c; font: 16px/1.5 Georgia, "Times New Roman", serif; }
  .pg-nav { display: flex; align-items: center; gap: 28px; padding: 22px 48px; font: 500 14px/1 system-ui, sans-serif; }
  .pg-nav > b { flex: 1; font: 700 20px/1 Georgia, serif; letter-spacing: -0.01em; }
  .pg-hero { padding: 44px 48px 40px; }
  .pg-hero > h3 { margin: 0 0 14px; max-width: 12ch; font-size: 60px; line-height: 1.02; font-weight: 700; letter-spacing: -0.02em; }
  .pg-hero > p { margin: 0 0 24px; max-width: 44ch; font: 17px/1.5 system-ui, sans-serif; color: #6b5a4f; }
  .pg-cta { display: inline-block; padding: 12px 22px; border-radius: 4px; background: #b4552d; color: #fff; font: 600 15px/1 system-ui, sans-serif; }
  .pg-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; padding: 32px 48px 48px; border-top: 1px solid #e6dccf; font: 14px/1.5 system-ui, sans-serif; color: #6b5a4f; }
  .pg-cols b { display: block; margin-bottom: 4px; font: 700 18px/1.2 Georgia, serif; color: #2a211c; }
  .pg[data-narrow] { width: auto; }
  .pg[data-narrow] .pg-nav { padding: 16px 20px; gap: 16px; }
  .pg[data-narrow] .pg-hero { padding: 24px 20px; }
  .pg[data-narrow] .pg-hero > h3 { font-size: 40px; }
  .pg[data-narrow] .pg-cols { grid-template-columns: 1fr; gap: 14px; padding: 20px; }
  .pg-clip { overflow: hidden; }

  .zp-card.penna-card[data-penna] { display: flex; align-items: center; gap: 12px; width: fit-content; min-width: 300px; padding: 8px 14px 8px 8px; }
  .zp-thumb { flex: none; width: 108px; height: 68px; overflow: hidden; border-radius: 7px; box-shadow: 0 0 0 1px color-mix(in srgb, var(--penna-fg) 14%, transparent); }
  .zp-thumb > .pg { zoom: 0.12; }
  .zp-who { display: flex; flex-direction: column; min-width: 0; }
  .zp-who > b { font-weight: 500; }
  .zp-who > span { font-size: var(--penna-text-small-size); line-height: var(--penna-text-small-line); color: var(--penna-muted); }

  .zp-frame { overflow: hidden; border-radius: 12px; box-shadow: 0 0 0 1px color-mix(in srgb, var(--penna-fg) 16%, transparent); }
  .zp-bar { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 6px 0 12px; background: color-mix(in srgb, var(--penna-fg) 6%, var(--penna-bg)); font-size: var(--penna-text-small-size); line-height: var(--penna-text-small-line); color: var(--penna-fg-muted); --penna-icon-size: 13px; }
  .zp-bar > span { flex: 1; min-width: 0; overflow: hidden; color: var(--penna-fg); text-overflow: ellipsis; white-space: nowrap; }
  .zp-bar > [data-penna] { width: 24px; height: 24px; }
  .zp-view { height: 300px; overflow: hidden; background: #faf6f0; }
  .zp-view > .pg { zoom: 0.612; }

  .zs-wash { display: grid; place-items: center; height: 148px; border-radius: 12px; background: color-mix(in srgb, var(--penna-fg) 4%, transparent); }
  .zs-fail { display: flex; align-items: center; gap: 8px; color: var(--penna-fg-muted); --penna-icon-size: 14px; }
  .zs-fail > span { flex: 1; }

  .zk { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 20px 24px; align-items: start; }
  .zk > div { display: grid; gap: 8px; justify-items: start; min-width: 0; }
  .zk code { font-family: var(--penna-mono); font-size: var(--penna-text-micro-size); color: var(--penna-muted); }
  .zk-field[data-penna="field"] { display: flex; align-items: center; width: 160px; height: var(--penna-control-md); padding: 0 12px; color: var(--penna-muted); }
  .zk-series { display: flex; gap: 4px; }
  .zk-series > i { width: 22px; height: 22px; border-radius: 6px; }
  .zk-table { border-collapse: collapse; font-size: var(--penna-text-small-size); line-height: var(--penna-text-small-line); }
  .zk-table th, .zk-table td { padding: 4px 16px 4px 0; border-bottom: 1px solid var(--penna-divider); text-align: left; font-weight: 400; }
  .zk-table th { color: var(--penna-muted); }
  .zk-table td:last-child, .zk-table th:last-child { padding-right: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .zk .penna-slider { width: 160px; }
  .zk .penna-progress { width: 160px; }

  .zr { border-collapse: collapse; width: 100%; max-width: 1180px; }
  .zr th, .zr td { padding: 8px 20px 8px 0; border-bottom: 1px solid var(--penna-divider); text-align: left; vertical-align: top; }
  .zr th { font-size: var(--penna-text-small-size); font-weight: 500; color: var(--penna-muted); }
  .zr code { font-family: var(--penna-mono); font-size: var(--penna-text-mono-size); }

  .zz-final.penna-variants { --penna-variant-width: 640px; }
  .zz-small.penna-variants { --penna-variant-width: 440px; }
  .zc { display: grid; gap: 4px; }
  .zc svg { display: block; width: 100%; height: auto; }
  .zc text { font: 11px/1 system-ui, sans-serif; fill: var(--penna-fg-muted); }
  .zc-legend { display: flex; gap: 14px; font-size: var(--penna-text-small-size); line-height: var(--penna-text-small-line); color: var(--penna-fg-muted); }
  .zc-legend > span { display: inline-flex; align-items: center; gap: 6px; }
  .zc-legend i { width: 8px; height: 8px; border-radius: 2px; }
  .zv-row > .zv-push { flex: 1; }
  .zv-row .penna-slider { width: 140px; }
  .zv-row > small { font-size: var(--penna-text-small-size); color: var(--penna-fg-muted); font-variant-numeric: tabular-nums; }
  .zp-view[data-wash] { display: grid; place-items: center; background: color-mix(in srgb, var(--penna-fg) 4%, transparent); }
  .zp-view[data-fail] { display: flex; align-items: center; justify-content: center; gap: 8px; background: none; color: var(--penna-fg-muted); --penna-icon-size: 14px; }
  .zp-bar > [data-penna][data-state="hover"] { background: var(--penna-quiet-hover, color-mix(in srgb, var(--penna-fg) 10%, transparent)); }
  .zp-frame[data-hover] { box-shadow: 0 0 0 1px color-mix(in srgb, var(--penna-fg) 28%, transparent); }
  .zz-final .zp-view { height: 332px; }
  .zz-final .zp-view > .pg { zoom: 0.6567; }
  .zz-final .zp-view[data-fail] { height: 96px; }
  .zn { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px 48px; align-items: start; max-width: 1900px; }
  .zn h3 { margin: 0 0 6px; font-size: var(--penna-text-body-size); font-weight: 600; }
  .zn table { border-collapse: collapse; width: 100%; font-size: var(--penna-text-body-size); line-height: var(--penna-text-body-line); }
  .zn td { padding: 6px 16px 6px 0; border-bottom: 1px solid var(--penna-divider); vertical-align: top; }
  .zn td:first-child { width: 34%; color: var(--penna-fg-muted); }
  .zn code { font-family: var(--penna-mono); font-size: var(--penna-text-mono-size); }
</style>
</head>
<body>
<main class="zz-page">
  <div class="zz-intro">
    <h1>Chat visuals and page frames: final</h1>
  </div>

  <section data-shot="visual">
    <h2>A visual sits on the chat ground</h2>
    <div class="penna-variants zz-variants zz-final" data-visual></div>
  </section>

  <section data-shot="states">
    <h2>A visual's states</h2>
    <div class="penna-variants zz-variants zz-small" data-states></div>
  </section>

  <section data-shot="page">
    <h2>A page sits in a frame</h2>
    <div class="penna-variants zz-variants zz-final" data-pages></div>
  </section>

  <section data-shot="numbers">
    <h2>Numbers</h2>
    <div class="zn" data-numbers></div>
  </section>
</main>
<script>
(() => {
  const btn = (label, extra = "") => `<button class="penna-button" data-penna="button" ${extra}><span class="penna-label" data-penna-text>${label}</span></button>`;
  const icon = (name, extra = "") => `<button data-penna="icon-button" ${extra}><i data-icon="${name}"></i></button>`;
  const badge = (label, tone) => `<span class="penna-badge" data-penna="badge"${tone ? ` data-tone="${tone}"` : ""}><span class="badge-text" data-penna-text>${label}</span></span>`;
  const progress = (value) => `<div class="penna-progress" data-size="small" style="--penna-value: ${value}%"><div class="penna-progress-fill"></div></div>`;
  const segmented = (labels, on = 0) => `<div class="penna-segmented" data-penna="field" data-size="small" data-still data-value="${on}" role="radiogroup"><div class="penna-segments" data-penna="button.quiet" data-state="current"><span class="penna-segment-pill"></span>${labels
    .map((label, index) => `<span class="penna-segment" role="button" aria-selected="${index === on}"><span class="penna-label" data-penna-text>${label}</span></span>`)
    .join("")}</div></div>`;
  const slider = (value) => `<div class="penna-slider" data-min="0" data-max="100" data-value="${value}" style="--penna-value: ${value}%"><div class="penna-rail"><div class="penna-fill"></div><div class="penna-knob"></div></div></div>`;

  const stores = [["Redis", "0.4", 14, "fastest"], ["SQLite", "1.2", 43, ""], ["Postgres", "2.8", 100, ""]];
  const tiles = `<div class="zv-tiles">${stores
    .map(([name, ms, share, note]) => `<div class="penna-card zv-tile" data-penna="card.activity"><div class="zv-tile-head"><b>${name}</b>${note ? badge(note, "success") : ""}</div><div class="zv-stat">${ms}<small>ms</small></div>${progress(share)}</div>`)
    .join("")}</div>`;
  const picks = `<div class="zv-row">${btn("Use Redis", `data-tone="primary" data-prominent`)}${btn("Use SQLite")}${btn("Use Postgres")}</div>`;
  const tools = (first = "braces") => `<div class="zv-tools" data-penna="popover">${icon(first)}${icon("external-link")}${icon("copy")}</div>`;
  const compare = (extra = "", buttons = true) => `<div class="zv">${extra}<div class="zv-row">${segmented(["p50", "p99", "Memory"])}</div>${tiles}${buttons ? picks : ""}</div>`;

  const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun"];
  const signups = [120, 180, 150, 240, 310, 290];
  const trials = [60, 85, 90, 130, 150, 170];
  const x = (index) => 44 + index * 104;
  const y = (value) => 150 - (value / 320) * 130;
  const line = (values) => values.map((value, index) => `${index ? "L" : "M"}${x(index)} ${y(value)}`).join(" ");
  const chart = `<div class="zc"><svg viewBox="0 0 592 176" role="img">
    ${[0, 100, 200, 300].map((value) => `<line x1="36" x2="584" y1="${y(value)}" y2="${y(value)}" stroke="var(--penna-divider)" stroke-width="1"/><text x="28" y="${y(value) + 4}" text-anchor="end">${value}</text>`).join("")}
    <path d="${line(trials)}" fill="none" stroke="var(--penna-success)" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${line(signups)}" fill="none" stroke="var(--penna-accent)" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/>
    ${signups.map((value, index) => `<circle cx="${x(index)}" cy="${y(value)}" r="3" fill="var(--penna-accent)"/>`).join("")}
    ${months.map((month, index) => `<text x="${x(index)}" y="170" text-anchor="middle">${month}</text>`).join("")}
  </svg></div>`;
  const trend = `<div class="zv"><div class="zv-row">${segmented(["Line", "Bars"])}<span class="zv-push"></span><small>Smoothing</small>${slider(30)}</div>${chart}<div class="zc-legend"><span><i style="background: var(--penna-accent)"></i>Signups</span><span><i style="background: var(--penna-success)"></i>Trials</span></div></div>`;

  const bubble = (text) => `<div class="penna-chat-message"><div class="penna-card penna-chat-bubble" data-penna="card.bubble"><span data-penna-text>${text}</span></div></div>`;
  const chat = (ask, before, body, after) => `<div class="zz-chat">${ask ? bubble(ask) : ""}${before ? `<p>${before}</p>` : ""}${body}${after ? `<p>${after}</p>` : ""}</div>`;
  const figure = (name, note, body) => `<figure>${body}<figcaption><b>${name}</b>${note}</figcaption></figure>`;

  document.querySelector("[data-visual]").innerHTML = [
    figure("Parts and buttons", "A button drafts its answer into the composer", chat("Which store should hold sessions?", "I ran each one with 10k sessions on this machine.", compare(), "Redis is fastest. SQLite needs nothing extra to run.")),
    figure("A chart", "Series take the theme's colors", chat("How did signups go this half?", "Signups more than doubled, and trials kept pace.", trend, "April is where the new onboarding shipped.")),
  ].join("");

  const code = `<pre class="zb-code">&lt;<i>div</i> <u>class</u>=<s>"viz-grid"</s>&gt;
  &lt;<i>div</i> <u>class</u>=<s>"card"</s>&gt;
    &lt;<i>div</i> <u>class</u>=<s>"text-muted"</s>&gt;Redis&lt;/<i>div</i>&gt;
    &lt;<i>div</i> <u>class</u>=<s>"viz-stat-value"</s>&gt;0.4&lt;/<i>div</i>&gt;
  &lt;/<i>div</i>&gt;
&lt;/<i>div</i>&gt;</pre>`;
  const stage = (body) => `<div class="zz-chat">${body}</div>`;
  document.querySelector("[data-states]").innerHTML = [
    figure("Resting, and in use", "A picture until the first click, which also lands. It looks the same live", stage(compare("", false))),
    figure("Pointer over it", "Show the code, open as a page, copy", stage(compare(tools(), false))),
    figure("Showing its code", "", stage(`<div class="zv">${tools("eye")}<div class="penna-card" data-penna="card.code">${code}</div></div>`)),
    figure("Drawing, and while it streams", "", stage(`<div class="zs-wash"><span class="penna-spinner" data-color="muted"><i data-icon="loader"></i></span></div>`)),
    figure("Could not draw", "", stage(`<div class="zs-fail"><i data-icon="triangle-alert"></i><span>Preview timed out</span>${btn("Open as a page")}</div>`)),
  ].join("");

  const page = `<div class="pg">
    <div class="pg-nav"><b>Fig &amp; Kettle</b><span>Beans</span><span>Visit</span><span>Subscribe</span></div>
    <div class="pg-hero"><h3>Coffee, roasted on Tuesdays</h3><p>Small batches from three farms, on your doorstep by Thursday.</p><span class="pg-cta">Start a subscription</span></div>
    <div class="pg-cols"><div><b>Three farms</b>Huila, Yirgacheffe and Tarrazú, bought direct.</div><div><b>One roast day</b>Every bag ships within two days of roasting.</div><div><b>No contract</b>Skip a week or stop from the same link.</div></div>
  </div>`;
  const frame = (view, hover) => `<div class="zp-frame"${hover ? " data-hover" : ""}><div class="zp-bar"><i data-icon="globe"></i><span>Fig &amp; Kettle</span>${icon("braces")}${icon("external-link", hover ? `data-state="hover"` : "")}</div>${view}</div>`;
  const ask = "Build a landing page for the coffee shop.";
  const after = "It is in site/index.html.";
  document.querySelector("[data-pages]").innerHTML = [
    figure("Resting", "The top of the page at desktop width, scaled to the column", chat(ask, "", frame(`<div class="zp-view">${page}</div>`), after)),
    figure("Pointer over it", "A click anywhere opens the page in a browser pane", chat(ask, "", frame(`<div class="zp-view">${page}</div>`, true), after)),
    figure("Drawing, and while it streams", "", chat("", "", frame(`<div class="zp-view" data-wash><span class="penna-spinner" data-color="muted"><i data-icon="loader"></i></span></div>`), "")),
    figure("Could not draw", "", chat("", "", frame(`<div class="zp-view" data-fail><i data-icon="triangle-alert"></i><span>Preview timed out</span></div>`), "")),
  ].join("");

  const table = (title, rows) => `<div><h3>${title}</h3><table>${rows.map(([name, value]) => `<tr><td>${name}</td><td>${value}</td></tr>`).join("")}</table></div>`;
  document.querySelector("[data-numbers]").innerHTML = [
    table("A visual", [
      ["Counts as one", "<code>html preview</code> block, or a visualize reference"],
      ["Place", "the reply's text column, full width, spaced like a figure; no fill, edge or padding"],
      ["Page ground", "transparent, body margin and padding 0, so the chat's ground shows"],
      ["Type", "the app's UI font, body 13 / 18"],
      ["Styles", "penna's kit CSS (78 KB) and the live theme's tokens for the roles below, inlined; follows mode, accent, radius and density"],
      ["Width", "the column's, in 32 px steps (as today)"],
      ["Height", "measured until quiet for 150 ms, for up to 5 s (1.5 s today); 8 to 800 px"],
      ["Layout inside", "parts 12 apart; tiles 8 apart with 12 padding; stat 22 / 28 semibold, tabular"],
      ["Controls", "three 24 px icon buttons with 13 px glyphs in a popover, 8 px outside the top right corner; shown under the pointer, always on touch"],
      ["First click", "makes it live and reaches the page; one visual is live at a time"],
      ["A page's reply", "drafts into the composer, never sends"],
      ["Drawing", "a wash at fg 4%, radius 12, at the last height or 148 px, with a 14 px muted spinner"],
      ["Failure", "after 3 s: Preview timed out, with Open as a page"],
    ]),
    table("A page", [
      ["Counts as one", "<code>html</code> block that starts with <code>&lt;!doctype</code> or <code>&lt;html</code>, any length"],
      ["Frame", "radius 12, a 1 px edge at fg 16% (28% under the pointer)"],
      ["Strip", "32 px, fg 6% over the ground; 13 px globe; the page's <code>&lt;title&gt;</code>, or Page"],
      ["Strip buttons", "24 px: the code (opens in the view pane), open as a page"],
      ["Picture", "the page at 1280 × 720, scaled to the column; height is width × 9 / 16"],
      ["Colors", "the page's own, white where it sets none; no theme, no kit"],
      ["A click", "opens the page in a browser pane beside the chat; never live in place"],
      ["Drawing and failure", "as a visual, under the strip"],
      ["Other html blocks", "fragments stay code blocks and cards, with Preview, as today"],
    ]),
    table("Names a model writes, and what draws them", [
      ["<code>.btn</code>, <code>.btn-primary</code>", "<code>button</code>; prominent with the primary tone"],
      ["<code>.nav-pills</code>, <code>.nav-link.active</code>", "segmented, small"],
      ["<code>.form-range</code>", "slider"],
      ["<code>.form-control</code>, <code>.form-select</code>", "<code>field</code>"],
      ["<code>.card</code>", "<code>card.activity</code>"],
      ["<code>.viz-badge</code>", "<code>badge</code>, with success, warning and danger tones"],
      ["<code>.progress</code>, <code>.progress-bar</code>", "progress, small"],
      ["<code>.viz-stat-value</code>, <code>.text-muted</code>, <code>.text-small</code>", "the stat size above, the muted ink, small 12 / 16"],
      ["<code>table</code>, <code>hr</code>", "rows ruled with the divider"],
      ["<code>.viz-grid</code>, <code>.viz-row</code>", "a grid of 150 px columns 8 apart; a wrapping row 8 apart"],
    ]),
    table("Colors a model names", [
      ["<code>--viz-series-1</code> to <code>6</code>", "accent, success, warning, danger, then two hues between them"],
      ["<code>--background</code>, <code>--foreground</code>", "transparent, the chat's ink"],
      ["<code>--muted-foreground</code>, <code>--border</code>", "the muted ink, the divider"],
      ["<code>--primary</code>, <code>--primary-foreground</code>", "the primary tone and its ink"],
      ["<code>--card</code>, <code>--muted</code>", "the <code>card.activity</code> wash"],
      ["Clients", "desktop first; web, iPad and iPhone keep code blocks until their turn"],
    ]),
  ].join("");

  const place = () => {
    for (const group of document.querySelectorAll(".penna-segmented")) {
      const segments = group.querySelectorAll(".penna-segment");
      const on = segments[Number(group.dataset.value) || 0];
      const pill = group.querySelector(".penna-segment-pill");
      if (!on || !pill) continue;
      pill.style.setProperty("--pill-x", `${on.offsetLeft}px`);
      pill.style.setProperty("--pill-w", `${on.offsetWidth}px`);
      pill.style.setProperty("--penna-pill-r", `${on.offsetHeight / 2}px`);
    }
  };
  const only = new URLSearchParams(location.search).get("shot");
  if (only) {
    for (const section of document.querySelectorAll("[data-shot]")) section.hidden = section.dataset.shot !== only;
    document.querySelector(".zz-intro").hidden = only !== "visual";
  }
  window.pennaKit?.roundAll?.();
  place();
  addEventListener("load", () => { window.pennaKit?.roundAll?.(); place(); });
})();
</script>
</body>
</html>
