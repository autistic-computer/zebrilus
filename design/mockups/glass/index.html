<script>
(() => {
  const W = 1640;
  const H = 720;
  const VARIANTS = [
    ["today", "Today"],
    ["smoke", "Smoke"],
    ["dither", "Dither"],
    ["vellum", "Vellum"],
    ["edgelit", "Edge-lit"],
    ["reeded", "Reeded"],
  ];
  const BACKDROPS = ["glow", "busy", "day"];
  const svgFilters = Boolean(navigator.userAgentData) && CSS.supports("backdrop-filter", "url(#gv-cap)");
  if (svgFilters) document.documentElement.classList.add("gv-svgf");

  const state = { bg: "glow", mode: window.pennaKit?.choice.mode ?? "dark", frost: 50, solo: "" };
  const readHash = () => {
    const hash = new URLSearchParams(location.hash.slice(1));
    if (BACKDROPS.includes(hash.get("bg"))) state.bg = hash.get("bg");
    if (["dark", "light"].includes(hash.get("mode"))) state.mode = hash.get("mode");
    const frost = Number(hash.get("frost"));
    if (hash.has("frost") && Number.isFinite(frost)) state.frost = Math.min(100, Math.max(0, Math.round(frost)));
    state.solo = VARIANTS.some(([id]) => id === hash.get("solo")) ? hash.get("solo") : "";
  };
  const writeHash = () => {
    const hash = new URLSearchParams({ bg: state.bg, mode: state.mode, frost: String(state.frost) });
    if (state.solo) hash.set("solo", state.solo);
    history.replaceState(null, "", `#${hash}`);
  };

  const grid = document.querySelector("[data-grid]");
  const figures = VARIANTS.map(([id, name]) => {
    const figure = document.getElementById("gv-figure").content.firstElementChild.cloneNode(true);
    figure.dataset.v = id;
    const tile = figure.querySelector(".gv-tile");
    tile.dataset.v = id;
    tile.append(document.getElementById("gv-scene").content.cloneNode(true));
    figure.querySelector("figcaption > b").textContent = name;
    figure.querySelector(".gv-frame").addEventListener("click", () => {
      state.solo = state.solo === id ? "" : id;
      render();
    });
    grid.append(figure);
    return figure;
  });

  const soloSeg = document.querySelector('[data-tune="solo"]');
  soloSeg.innerHTML = [["", "All"], ...VARIANTS].map(([id, name]) => `<button data-penna="button.quiet" data-value="${id}">${name}</button>`).join("");

  const n = (element, name) => parseFloat(getComputedStyle(element).getPropertyValue(name)) || 0;
  const f2 = (value) => String(Math.round(value * 100) / 100).replace(/^0\./, ".").replace(/^-0\./, "-.");
  const f0 = (value) => String(Math.round(value));
  const kitGlass = () => getComputedStyle(document.documentElement).getPropertyValue("--penna-glass-backdrop").trim();
  const kitValue = (name) => kitGlass().match(new RegExp(`${name}\\(([^)]+)\\)`))?.[1] ?? "";
  const kitTint = () => {
    const hex = getComputedStyle(document.documentElement).getPropertyValue("--penna-glass-tint").trim();
    return hex.length === 9 ? f2(parseInt(hex.slice(7), 16) / 255) : "";
  };

  const trio = (tile, label, suffix, format) => [label, ...["chrome", "content", "float"].map((kind) => format(n(tile, `--${kind}-${suffix}`)))];
  const READOUTS = {
    today: (t) => [
      ["tint", f2(n(t, "--chrome-a")), ".5 over chrome", `.71, kit`],
      ["blur", f0(n(t, "--chrome-blur")), "none", kitValue("blur")],
      ["saturate", f2(n(t, "--chrome-sat")), "none", kitValue("saturate")],
      ["light", `clamped at ${f2(n(t, "--cap"))}${svgFilters ? "" : " (brightness stand-in)"}`],
      ["fill", "tinted to the backdrop hue"],
      ["edge", "1px at 7%, 40px side glow, floating uses the kit rim"],
    ],
    smoke: (t) => [
      trio(t, "tint", "a", f2),
      trio(t, "blur", "blur", f0),
      trio(t, "saturate", "sat", f2),
      trio(t, "contrast", "con", f2),
      trio(t, "brightness", "bright", f2),
      ["fill", "neutral, no hue shift"],
      ["edge", "dark 1px outside, bright 1px inside, no glow"],
    ],
    dither: (t) => [
      trio(t, "stipple", "a", f2),
      trio(t, "blur", "blur", f0),
      trio(t, "saturate", "sat", f2),
      trio(t, "contrast", "con", f2),
      trio(t, "brightness", "bright", f2),
      ["cell", `${f0(n(t, "--cell"))}px, 8×8 threshold, opaque fill`],
      ["edge", "solid 1px ink, hard drop, no glint"],
    ],
    vellum: (t) => [
      trio(t, "tint", "a", f2),
      trio(t, "blur", "blur", f0),
      trio(t, "saturate", "sat", f2),
      [ "grain", f2(n(t, "--grain-chrome")), f2(n(t, "--grain-content")), f2(n(t, "--grain-float"))],
      trio(t, "contrast", "con", f2),
      trio(t, "brightness", "bright", f2),
      ["edge", "inner hairline, fg at 10%"],
    ],
    edgelit: (t) => [
      ["interior", f2(n(t, "--chrome-a")), f2(n(t, "--content-a")), f2(n(t, "--float-a"))],
      ["band", "none", `${f0(n(t, "--band"))}px`, `${f0(n(t, "--float-band"))}px`],
      ["leak", "", f2(n(t, "--leak")), f2(n(t, "--leak"))],
      trio(t, "blur", "blur", f0),
      trio(t, "saturate", "sat", f2),
      trio(t, "contrast", "con", f2),
      trio(t, "brightness", "bright", f2),
      ["edge", "1px dark outside, lit 1px inside"],
    ],
    reeded: (t) => [
      trio(t, "tint", "a", f2),
      trio(t, "blur", "blur", f0),
      trio(t, "saturate", "sat", f2),
      trio(t, "contrast", "con", f2),
      trio(t, "brightness", "bright", f2),
      ["ribs", `chrome only, pitch ${f2(n(t, "--pitch"))}px (one cell), shade ${f2(n(t, "--rib"))}`],
      ["bend", svgFilters ? `${f0(n(t, "--reed"))}px displacement per rib` : "off, gradient only"],
      ["floating", "smooth, no ribs; selection is a smooth lens"],
      ["note", "approximation"],
    ],
  };

  const readout = (figure) => {
    const tile = figure.querySelector(".gv-tile");
    const rows = READOUTS[figure.dataset.v](tile);
    const head = `<tr><th></th><th>chrome</th><th>content</th><th>floating</th></tr>`;
    figure.querySelector(".gv-read").innerHTML =
      head +
      rows
        .map(([label, ...cells]) =>
          cells.length === 1 ? `<tr><td>${label}</td><td colspan="3">${cells[0]}</td></tr>` : `<tr><td>${label}</td>${cells.map((cell) => `<td>${cell}</td>`).join("")}</tr>`,
        )
        .join("");
  };

  const BAYER = [0, 32, 8, 40, 2, 34, 10, 42, 48, 16, 56, 24, 50, 18, 58, 26, 12, 44, 4, 36, 14, 46, 6, 38, 60, 28, 52, 20, 62, 30, 54, 22, 3, 35, 11, 43, 1, 33, 9, 41, 51, 19, 59, 27, 49, 17, 57, 25, 15, 47, 7, 39, 13, 45, 5, 37, 63, 31, 55, 23, 61, 29, 53, 21];
  const tiles = new Map();
  const bayerTile = (level, cell) => {
    const scale = Math.max(1, Math.round(devicePixelRatio));
    const key = `${level}/${cell}/${scale}`;
    if (tiles.has(key)) return tiles.get(key);
    const side = 8 * cell * scale;
    const canvas = Object.assign(document.createElement("canvas"), { width: side, height: side });
    const context = canvas.getContext("2d");
    context.fillStyle = "#000";
    for (let i = 0; i < 64; i++) {
      if (BAYER[i] < level) context.fillRect((i % 8) * cell * scale, Math.floor(i / 8) * cell * scale, cell * scale, cell * scale);
    }
    const url = `url(${canvas.toDataURL()}) 0 0 / ${8 * cell}px ${8 * cell}px repeat`;
    tiles.set(key, url);
    return url;
  };

  const dither = (tile) => {
    const cell = Math.max(1, Math.round(n(tile, "--cell")));
    for (const kind of ["chrome", "content", "float"]) {
      const level = Math.round(Math.min(1, Math.max(0, n(tile, `--${kind}-a`))) * 64);
      tile.style.setProperty(`--${kind}-mask`, bayerTile(level, cell));
    }
  };

  const roundRect = (x, y, w, h, r) =>
    `M${x + r} ${y}H${x + w - r}A${r} ${r} 0 0 1 ${x + w} ${y + r}V${y + h - r}A${r} ${r} 0 0 1 ${x + w - r} ${y + h}H${x + r}A${r} ${r} 0 0 1 ${x} ${y + h - r}V${y + r}A${r} ${r} 0 0 1 ${x + r} ${y}Z`;
  const holes = (win) => {
    const box = win.getBoundingClientRect();
    const zoom = box.width / win.offsetWidth || 1;
    let path = `M0 0H${win.offsetWidth}V${win.offsetHeight}H0Z`;
    for (const pane of win.querySelectorAll('[data-s="content"]')) {
      const rect = pane.getBoundingClientRect();
      const x = (rect.left - box.left) / zoom;
      const y = (rect.top - box.top) / zoom;
      const r = parseFloat(getComputedStyle(pane).borderTopLeftRadius) || 0;
      path += roundRect(+x.toFixed(2), +y.toFixed(2), +(rect.width / zoom).toFixed(2), +(rect.height / zoom).toFixed(2), r);
    }
    win.style.setProperty("--holes", `path(evenodd, "${path}")`);
  };

  const cap = () => {
    const today = document.querySelector('.gv-tile[data-v="today"]');
    const limit = n(today, "--cap");
    const values = Array.from({ length: 33 }, (_, i) => f2(Math.min(i / 32, limit))).join(" ");
    document.querySelectorAll("#gv-cap feComponentTransfer > *").forEach((func) => func.setAttribute("tableValues", values));
  };

  const pitch = () => {
    const probe = document.createElement("span");
    probe.className = "zz-terminal";
    probe.style.cssText = "position:absolute;visibility:hidden;padding:0;flex:none";
    probe.textContent = "M".repeat(40);
    document.body.append(probe);
    const width = probe.getBoundingClientRect().width / 40;
    probe.remove();
    document.documentElement.style.setProperty("--pitch", width.toFixed(3));
    return width;
  };

  const reed = () => {
    const tile = document.querySelector('.gv-tile[data-v="reeded"]');
    const width = n(tile, "--pitch");
    const strength = n(tile, "--reed");
    const canvas = Object.assign(document.createElement("canvas"), { width: 32, height: 2 });
    const context = canvas.getContext("2d");
    const image = context.createImageData(32, 2);
    for (let x = 0; x < 32; x++) {
      const t = (x + 0.5) / 32;
      const r = Math.round(255 * (1 - t));
      for (let y = 0; y < 2; y++) {
        const i = (y * 32 + x) * 4;
        image.data[i] = r;
        image.data[i + 1] = 128;
        image.data[i + 2] = 128;
        image.data[i + 3] = 255;
      }
    }
    context.putImageData(image, 0, 0);
    const filter = document.getElementById("gv-reed");
    const ramp = filter.querySelector("feImage");
    ramp.setAttribute("width", width.toFixed(3));
    ramp.setAttribute("height", "8");
    ramp.setAttribute("href", canvas.toDataURL());
    filter.querySelector("feDisplacementMap").setAttribute("scale", f2(strength));
  };

  const fit = () => {
    for (const figure of figures) {
      if (figure.offsetParent === null) continue;
      const frame = figure.querySelector(".gv-frame");
      const zoom = Math.min(1, frame.clientWidth / W);
      frame.style.height = `${H * zoom}px`;
      figure.querySelector(".gv-tile").style.zoom = zoom;
    }
  };

  const settle = () => {
    pitch();
    cap();
    reed();
    for (const figure of figures) {
      const tile = figure.querySelector(".gv-tile");
      holes(tile.querySelector(".gv-win"));
      if (figure.dataset.v === "dither") dither(tile);
      readout(figure);
    }
  };

  const walls = () => {
    for (const figure of figures) {
      figure.querySelector(".gv-wall").replaceWith(document.getElementById(`wall-${state.bg}`).content.firstElementChild.cloneNode(true));
    }
  };

  const mark = () => {
    for (const group of document.querySelectorAll("[data-tune]")) {
      for (const button of group.children) {
        if (state[group.dataset.tune] === button.dataset.value) button.dataset.state = "selected";
        else button.removeAttribute("data-state");
      }
    }
    document.querySelector("[data-frost]").value = state.frost;
    document.querySelector("[data-frost-value]").textContent = state.frost;
  };

  let shownBg = "";
  const render = () => {
    document.documentElement.dataset.bg = state.bg;
    document.documentElement.style.setProperty("--f", String(state.frost / 100));
    if (shownBg !== state.bg) {
      walls();
      shownBg = state.bg;
    }
    if (window.pennaKit && window.pennaKit.choice.mode !== state.mode) {
      window.pennaKit.choice.mode = state.mode;
      window.pennaKit.apply();
    }
    if (state.solo) grid.dataset.solo = "";
    else delete grid.dataset.solo;
    figures.forEach((figure) => figure.toggleAttribute("data-solo", figure.dataset.v === state.solo));
    mark();
    writeHash();
    fit();
    settle();
  };

  document.querySelectorAll("[data-tune]").forEach((group) =>
    group.addEventListener("click", (event) => {
      const button = event.target.closest("[data-value]");
      if (!button) return;
      state[group.dataset.tune] = button.dataset.value;
      render();
    }),
  );
  document.querySelector("[data-frost]").addEventListener("input", (event) => {
    state.frost = Number(event.target.value);
    render();
  });
  addEventListener("keydown", (event) => {
    if (event.key === "Escape" && state.solo) {
      state.solo = "";
      render();
    }
  });
  addEventListener("hashchange", () => {
    readHash();
    render();
  });
  document.addEventListener("penna-theme", (event) => {
    state.mode = event.detail.mode;
    mark();
    writeHash();
    setTimeout(settle, 120);
    setTimeout(settle, 600);
  });
  new ResizeObserver(fit).observe(grid);

  readHash();
  render();
  addEventListener("load", () => {
    fit();
    settle();
    window.pennaKit?.roundAll?.();
    setTimeout(settle, 300);
  });
  document.fonts?.ready.then(settle);
  window.glassBoard = { state, render, settle };
})();
</script>
