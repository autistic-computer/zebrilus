[workspace]
authors = ["Fabricio Dematte <demfabris@gmail.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "zz-mojo"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]
build = "python3 ../scripts/port/guard.py python3 scripts/build.py"
test-protocol = "python3 ../scripts/port/guard.py mojo --fp-mode=contract=off -I . tests/test_protocol.mojo"
test-terminal = "python3 ../scripts/port/guard.py mojo --fp-mode=contract=off -I . tests/test_terminal_view.mojo"
test-bend-gate = "python3 ../scripts/port/guard.py mojo --fp-mode=contract=off -I . tests/test_bend_gate.mojo"
test-painter = "bash scripts/ui.sh test-painter"
test-readiness = "bash scripts/ui.sh test-readiness"
differential-colors = "python3 scripts/terminal_color_vectors.py"
differential-protocol = "python3 ../scripts/port/guard.py python3 scripts/protocol_vectors.py"
test-client-context = "python3 ../scripts/port/guard.py mojo --fp-mode=contract=off -I . tests/test_client_context.mojo"
differential-client-context = "python3 scripts/client_context_vectors.py"
differential-terminal-appearance = "python3 scripts/appearance_vectors.py"
test-appearance-runtime = "python3 scripts/appearance_runtime.py"
appearance-workspace-smoke = "python3 scripts/appearance_workspace.py"
differential-terminal-render = "python3 scripts/terminal_appearance_render_vectors.py"
differential-terminal-overlays = "python3 scripts/terminal_overlay_vectors.py"
test-terminal-render-state = "python3 ../scripts/port/guard.py mojo --fp-mode=contract=off -I ../../mjui/src ../../mjui/tests/terminal_appearance_probe.mojo"
terminal-pixels = "/usr/bin/python3 scripts/terminal_pixels.py"
test-terminal-settings = "python3 ../scripts/port/guard.py mojo --fp-mode=contract=off -I . tests/test_terminal_settings.mojo"
differential-terminal-settings = "python3 scripts/terminal_settings_vectors.py"
differential-client-files = "python3 scripts/client_file_vectors.py"
test-client-files = "python3 ../scripts/port/guard.py python3 scripts/client_file_io.py"
client-files-smoke = "python3 ../scripts/port/guard.py python3 scripts/client_file_smoke.py"
differential-exec = "python3 scripts/exec_vectors.py"
differential-cli-globals = "python3 scripts/cli_globals_vectors.py"
differential-cli-preflight = "python3 scripts/cli_preflight_vectors.py"
differential-palette-fuzzy = "python3 scripts/palette_fuzzy_vectors.py"
differential-palette-commands = "python3 scripts/palette_command_vectors.py"
differential-palette-navigation = "python3 scripts/palette_navigation_vectors.py"
differential-palette-dialogs = "python3 scripts/palette_dialog_vectors.py"
differential-palette-dialog-state = "python3 scripts/palette_dialog_state_vectors.py"
test-cli-parse = "python3 ../scripts/port/guard.py mojo --fp-mode=contract=off -I . tests/test_cli_parse.mojo"
cli-globals-smoke = "python3 scripts/cli_globals_smoke.py"
cli-backend-smoke = "python3 scripts/cli_backend_smoke.py"
cli-bootstrap-smoke = "python3 scripts/cli_bootstrap_smoke.py"
differential-cli-default = "python3 scripts/cli_default_vectors.py"
test-cli-default-home = "python3 scripts/cli_default_home.py"
differential-cli-attach = "python3 scripts/cli_attach_vectors.py"
differential-app-resume = "python3 scripts/app_resume_vectors.py"
app-resume-smoke = "python3 scripts/app_resume_smoke.py"
cli-default-smoke = { cmd = "python3 scripts/cli_default_smoke.py", depends-on = ["build"] }
app-launch-smoke = { cmd = "python3 scripts/app_launch_smoke.py", depends-on = ["build", "build-app"] }
test-exec-context = "python3 ../scripts/port/guard.py mojo --fp-mode=contract=off -I . tests/test_exec_context.mojo"
exec-smoke = "python3 ../scripts/port/guard.py python3 scripts/exec_smoke.py"
differential-control = "python3 scripts/control_vectors.py"
differential-tree = "python3 scripts/tree_vectors.py"
test-tree-codec = "python3 ../scripts/port/guard.py mojo --fp-mode=contract=off -I . tests/test_tree_codec.mojo"
differential-terminal = "python3 ../scripts/port/guard.py python3 scripts/terminal_codec_vectors.py"
differential-layout = "python3 scripts/layout_vectors.py"
differential-input = "python3 scripts/input_vectors.py"
differential-client-events = "python3 scripts/client_event_vectors.py"
differential-terminal-projection = "python3 scripts/terminal_projection_vectors.py"
test-terminal-history = "python3 ../scripts/port/guard.py mojo --fp-mode=contract=off -I . tests/test_terminal_history.mojo"
test-local-scroll = "python3 ../scripts/port/guard.py mojo --fp-mode=contract=off -I . tests/test_local_scroll_controller.mojo"
test-history-painter = "bash scripts/ui.sh test-history-painter"
differential-history = "python3 scripts/history_vectors.py"
history-smoke = "python3 scripts/history_smoke.py"
history-workspace-smoke = "python3 scripts/history_smoke.py --ui"
profile-history = "python3 ../scripts/port/guard.py mojo --fp-mode=contract=off -I . tests/terminal_history_profile.mojo"
test = "python3 ../scripts/port/guard.py python3 scripts/test.py"
smoke = { cmd = "python3 scripts/smoke.py", depends-on = ["build"] }
stream-smoke = "python3 ../scripts/port/guard.py python3 scripts/native_stream.py"
state-smoke = "python3 scripts/state_smoke.py"
test-keyboard = "python3 ../scripts/port/guard.py mojo --fp-mode=contract=off -I . -I ../../mjui/src tests/test_keyboard_controller.mojo"
keyboard-smoke = "python3 scripts/keyboard_smoke.py"
test-pointer = "python3 ../scripts/port/guard.py mojo --fp-mode=contract=off -I . -I ../../mjui/src tests/test_pointer_controller.mojo"
pointer-smoke = "python3 scripts/pointer_smoke.py"
test-command-output = "bash scripts/ui.sh test-command-output"
differential-command-output = "python3 scripts/command_output_vectors.py"
command-output-smoke = "python3 scripts/command_output_smoke.py"
test-ime-provenance = "python3 scripts/ime_provenance.py"
test-clipboard = "python3 ../scripts/port/guard.py mojo --fp-mode=contract=off -I . -I ../../mjui/src tests/test_clipboard.mojo"
differential-clipboard = "python3 scripts/clipboard_vectors.py"
clipboard-host-smoke = "python3 scripts/clipboard_host.py"
clipboard-workspace-smoke = "python3 scripts/clipboard_workspace.py"
test-terminal-search = "python3 ../scripts/port/guard.py mojo --fp-mode=contract=off -I . tests/test_terminal_search.mojo"
test-search-controller = "python3 scripts/search_checks.py"
test-search-chrome = "python3 scripts/search_checks.py --ui"
differential-search = "python3 scripts/search_vectors.py"
search-smoke = "python3 scripts/search_smoke.py"
search-workspace-smoke = "python3 scripts/search_smoke.py --ui"
build-app = "bash scripts/ui.sh build-app"
native-smoke = "python3 scripts/native_app.py"
build-shot = "bash scripts/ui.sh build-shot"
ui-smoke = { cmd = "python3 scripts/smoke.py --ui", depends-on = ["build", "build-shot"] }
run = "bash scripts/ui.sh run"
shot = "bash scripts/ui.sh shot"

[dependencies]
mojo = ">=1.1,<1.2"
